  });
}
/* 접거나 펼친 뒤 그 줄이 위에 붙은 줄 뒤로 숨었으면 제목 자리로 돌아간다 */
function keepWineRowInView(item, underRow) {
  if (!item) return;
  const tabs = appEl.querySelector(".type-filter");
  let stick = tabs ? tabs.getBoundingClientRect().bottom : 0;
  if (underRow) stick += underRow.offsetHeight;
  const top = item.getBoundingClientRect().top;
  if (top < stick) window.scrollTo(0, window.scrollY + top - stick);
}
/* 노트 등에서 와인으로 갈 때: 와인 기록 탭으로 바꾸고, 필터를 풀고, 그 와인을 펼쳐서 간다 */
function openWineInRecords(id) {
  if (!getWine(id)) return;
  activeTab = "records";
  view = "collection";
  typeFilter = "all";
  searchText = "";
  wineOpenId = String(id);
  selectedId = wineOpenId;
  wineOpenSection = null;
  detailConfirmDelete = false;
  render();
  const item = document.getElementById("wine-" + wineOpenId);
  if (item) item.scrollIntoView({ block: "start" });
}
function openEdit() {
  const wine = getWine(selectedId);
  if (!wine) return;
  detailScroll = Math.max(1, window.scrollY);
  pendingScroll = 1;
  formMode = "edit";
  form = formFromWine(wine);
  formPhoto = null;
  formError = "";
  formSaving = false;
  formDirty = false;
  view = "form";
  pushLayer();
  render({ restoreScroll: true });
}
function closeForm() {
  pendingScroll = detailScroll;
  formMode = null;
  formDirty = false;
  view = "collection";
  render({ restoreScroll: true });
}
function openWineNote(noteId) {
  const note = allWineNotes.find(function (n) { return n.id === noteId; });
  if (!note) return;
  dropLayers(historyDepth);
  pendingScroll = 1;
  formMode = null;
  view = "collection";
  tabScroll[activeTab] = window.scrollY;
  activeTab = note.kind;
  notesKind = note.kind;
  searchText = "";
  notesGroupBy[note.kind] = note.group || "all";
  notesOpenId = note.id;
  render({ restoreScroll: true });
  window.setTimeout(function () {
    const el = document.getElementById("note-" + note.id);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }, 80);
}
function saveForm() {
  formError = "";
  if (!form.name.trim()) { formError = "와인 이름을 입력해 주세요"; render({ keepScroll: true }); return; }
  if (!form.consumedDate) { formError = "마신 날을 입력해 주세요"; render({ keepScroll: true }); return; }
  const payload = payloadFromForm(form);
  const now = new Date().toISOString();
  const wine = getWine(selectedId);
  if (!wine) return;
  const updated = Object.assign({}, wine, payload, { updated_at: now });
  if (formPhoto === "removed") { updated.photo_url = null; updated.photo_thumbnail_url = null; }
  else if (formPhoto) { updated.photo_url = formPhoto.photo_url; updated.photo_thumbnail_url = formPhoto.photo_thumbnail_url; }
  const saved = commitLocal(function (l) {
    if (isLocalId(wine.id)) l.added = l.added.map(function (w) { return String(w.id) === String(wine.id) ? updated : w; });
    else l.edited[String(wine.id)] = updated;
  });
  if (!saved) {
    formError = "저장 공간이 부족해 저장하지 못했습니다. 사진을 빼고 다시 시도해 주세요.";
    render({ keepScroll: true });
    return;
  }
  formDirty = false;
  dropLayers(1);
  pendingScroll = detailScroll;
  formMode = null;
  view = "collection";
  render({ restoreScroll: true });
}
function deleteSelected() {
  const id = String(selectedId);
  commitLocal(function (l) {
    if (isLocalId(id)) {
      l.added = l.added.filter(function (w) { return String(w.id) !== id; });
    } else {
      delete l.edited[id];
      if (l.deleted.indexOf(id) === -1) l.deleted.push(id);
    }
  });
  wineOpenId = null;
  wineOpenSection = null;
  selectedId = null;
  detailConfirmDelete = false;
  render({ keepScroll: true });
}
function revertSelected() {
  const id = String(selectedId);
  commitLocal(function (l) { delete l.edited[id]; });
  render({ keepScroll: true });
}

/* ================= events ================= */
function bindViewEvents() {
  const search = document.getElementById("search");
  if (search && !search.dataset.bound) {
    search.dataset.bound = "1";
    search.addEventListener("input", function () {
      searchText = search.value;
      refreshSearch();
    });
  }
  const sortSelect = document.getElementById("sort-select");
  if (sortSelect) {
    sortSelect.addEventListener("change", function () {
      sortMode = sortSelect.value;
      render({ keepScroll: true });
    });
  }
  const formEl = document.getElementById("wine-form");
  if (formEl) {
    formEl.querySelectorAll("[data-field]").forEach(function (input) {
      const update = function () { form[input.getAttribute("data-field")] = input.value; formDirty = true; };
      input.addEventListener("input", update);
      input.addEventListener("change", update);
    });
    formEl.querySelectorAll("[data-score-key]").forEach(function (input) {
      input.addEventListener("input", function () {
        const index = Number(input.getAttribute("data-score-index"));
        form.scores[index][input.getAttribute("data-score-key")] = input.value;
        formDirty = true;
      });
    });
    const photoInput = document.getElementById("photo-input");
    if (photoInput) {
      photoInput.addEventListener("change", function () {
        const file = photoInput.files && photoInput.files[0];
        if (!file) return;
        processImageFile(file).then(function (result) {
          formPhoto = result;
          formError = "";
          formDirty = true;
          render({ keepScroll: true });
        }).catch(function (error) {
          formError = error && error.message === "too-large" ? "8MB 미만 사진만 선택 가능" : error && error.message === "unsupported-image" ? "JPG, PNG, WEBP 사진만 선택 가능" : "사진을 불러오지 못했습니다";
          render({ keepScroll: true });
        });
      });
    }
    formEl.addEventListener("submit", function (event) {
      event.preventDefault();
      saveForm();
    });
  }
}

appEl.addEventListener("click", function (event) {
  const target = event.target.closest("[data-action]");
  if (!target) return;
  const action = target.getAttribute("data-action");
  if (action === "retry-load") reloadFresh();
  else if (action === "toggle-wine") {
    const id = target.getAttribute("data-id");
    wineOpenId = wineOpenId === id ? null : id;
    selectedId = wineOpenId;
    wineOpenSection = null;
    detailConfirmDelete = false;
    render({ keepScroll: true });
    keepWineRowInView(document.getElementById("wine-" + id));
  }
  else if (action === "toggle-wine-section") {
    const key = target.getAttribute("data-section");
    wineOpenSection = wineOpenSection === key ? null : key;
    render({ keepScroll: true });
    const item = document.getElementById("wine-" + wineOpenId);
    if (item) keepWineRowInView(document.getElementById("wine-" + wineOpenId + "-" + key), item.querySelector(".wine-row"));
  }
  else if (action === "close-form") requestClose();
  else if (action === "edit-wine") openEdit();
  else if (action === "ask-delete") { detailConfirmDelete = true; render({ keepScroll: true }); }
  else if (action === "cancel-delete") { detailConfirmDelete = false; render({ keepScroll: true }); }
  else if (action === "confirm-delete") deleteSelected();
  else if (action === "revert-wine") revertSelected();
  else if (action === "tab") {
    const tab = target.getAttribute("data-tab");
    if (tab !== activeTab) {
      tabScroll[activeTab] = window.scrollY;
      activeTab = tab;
      searchText = "";
      if (tab !== "records") { notesKind = tab; notesOpenId = null; }
      pendingScroll = tabScroll[tab] || 1;
      render({ restoreScroll: true });
    }
  }
  else if (action === "type-filter") { typeFilter = target.getAttribute("data-type"); render({ keepScroll: true }); }
  else if (action === "clear-search") { searchText = ""; render({ keepScroll: true }); }
  else if (action === "reset-filters") { searchText = ""; typeFilter = "all"; render({ keepScroll: true }); }
  else if (action === "note-group") {
    notesGroupBy[notesKind] = target.getAttribute("data-group");
    notesOpenId = null;
    render({ keepScroll: true });
  }
  else if (action === "reset-note-filters") {
    notesGroupBy[notesKind] = "all";
    render({ keepScroll: true });
  }
  else if (action === "toggle-note") {
    const id = target.getAttribute("data-id");
    notesOpenId = notesOpenId === id ? null : id;
    render({ keepScroll: true });
    keepNoteRowInView(document.getElementById("note-" + id));
  }
  else if (action === "open-note") openWineNote(target.getAttribute("data-note-id"));
  else if (action === "open-linked-wine") openWineInRecords(target.getAttribute("data-id"));
  else if (action === "add-score") {
    form.scores.push({ source: "", vintage: "", score: "", ratingCount: "", note: "" });
    formDirty = true;
    render({ keepScroll: true });
  }
  else if (action === "remove-score") {
    form.scores.splice(Number(target.getAttribute("data-index")), 1);
    formDirty = true;
    render({ keepScroll: true });
  }
  else if (action === "remove-photo") {
    formPhoto = "removed";
    formDirty = true;
    render({ keepScroll: true });
  }
});

/* ================= 새로고침 =================
   홈 화면 앱에는 새로고침 버튼이 없고, 브라우저의 당겨서 새로고침은 overscroll-behavior로 막혀 있다.
   그래서 앱이 직접 한다: 맨 위에서 아래로 당겼다 놓으면 최신 페이지와 기록을 새로 받는다 */
const PULL_TRIGGER = 72;
const pullEl = document.createElement("div");
pullEl.className = "pull-refresh";
pullEl.setAttribute("aria-hidden", "true");
pullEl.innerHTML = '<span class="pull-refresh-icon">' + ICON_REFRESH + '</span><span class="pull-refresh-text"></span>';
document.body.appendChild(pullEl);
let pullStart = null;
let pullDistance = 0;
function setPull(distance, state) {
  pullDistance = distance;
  pullEl.style.setProperty("--pull", Math.min(distance, PULL_TRIGGER * 1.4) + "px");
  pullEl.querySelector(".pull-refresh-icon").style.transform = state === "loading" ? "" : "rotate(" + Math.round(distance * 4) + "deg)";
  pullEl.dataset.state = state;
  pullEl.querySelector(".pull-refresh-text").textContent = state === "loading" ? "새로 불러오는 중" : state === "ready" ? "놓으면 새로고침" : "당겨서 새로고침";
}
function endPull() {
  if (pullStart === null) return;
  pullStart = null;
  if (pullDistance >= PULL_TRIGGER) { setPull(PULL_TRIGGER, "loading"); reloadFresh(); }
  else setPull(0, "");
}
window.addEventListener("touchstart", function (event) {
  pullStart = event.touches.length === 1 && window.scrollY <= 1 && pullEl.dataset.state !== "loading" ? event.touches[0].clientY : null;
}, { passive: true });
window.addEventListener("touchmove", function (event) {
  if (pullStart === null) return;
  if (event.touches.length !== 1) { pullStart = null; setPull(0, ""); return; }
  const distance = (event.touches[0].clientY - pullStart) * 0.5;
  if (distance <= 0 || window.scrollY > 1) { if (pullDistance) setPull(0, ""); return; }
  setPull(distance, distance >= PULL_TRIGGER ? "ready" : "pull");
}, { passive: true });
window.addEventListener("touchend", endPull, { passive: true });
window.addEventListener("touchcancel", function () { pullStart = null; setPull(0, ""); }, { passive: true });

/* 폰에 남은 예전 화면 알아채기: 지금 올라가 있는 index.html의 스타일 · 스크립트가
   이 페이지와 다르면 새 페이지를 연다(5분에 한 번까지만) */
const STALE_KEY = "wine-stale-reload";
function checkForNewVersion() {
  fetch("index.html?v=" + Date.now(), { cache: "no-store" }).then(function (res) { return res.ok ? res.text() : ""; }).then(function (text) {
    if (!text) return;
    const doc = new DOMParser().parseFromString(text, "text/html");
    const pick = function (d) { return ["style", "script"].map(function (tag) { const el = d.querySelector(tag); return el ? el.textContent : ""; }).join("\n"); };
    if (pick(doc) === pick(document)) return;
    let last = 0;
    try { last = Number(sessionStorage.getItem(STALE_KEY)) || 0; } catch (e) { return; }
    if (Date.now() - last < 5 * 60 * 1000) return;
    try { sessionStorage.setItem(STALE_KEY, String(Date.now())); } catch (e) { return; }
    reloadFresh();
  }).catch(function () {});
}

/* 1분 넘게 다른 앱에 있다가 돌아오면 기록과 노트를 조용히 다시 받는다.
   바뀐 게 있으면 지금 화면 그대로 다시 그리고, 새 데이터를 이 페이지가 못 읽으면 새 페이지를 받는다 */
let hiddenAt = 0;
document.addEventListener("visibilitychange", function () {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (loadState !== "ready" || !hiddenAt || Date.now() - hiddenAt < 60000) return;
  hiddenAt = 0;
  checkForNewVersion();
  Promise.all([fetchJSON("data/wines.json"), fetchJSON("data/notes.json")]).then(function (results) {
    const winesChanged = JSON.stringify(results[0]) !== JSON.stringify(baseWines);
    const notesText = JSON.stringify(results[1]);
    const notesChanged = notesText !== notesSource;
    if (!winesChanged && !notesChanged) return;
    if (notesChanged) {
      try { buildNotes(results[1]); notesSource = notesText; notesFailed = false; } catch (e) { reloadFresh(); return; }
    }
    baseWines = results[0];
    wines = mergedWines();
    if (view === "collection") render({ keepScroll: true });
  }).catch(function () {});
});

loadData();
