<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141719" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="Wine" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Wine</title>
    <style>


:root {
  color-scheme: light dark;
  /* type scale: only these four sizes */
  --fs-xl: 24px; /* screen titles, big numbers */
  --fs-l: 18px;  /* section headings */
  --fs-m: 16px;  /* body text, inputs */
  --fs-s: 14px;  /* secondary: captions, notes, tables, tabs */
  --lh-xl: 1.35;
  --lh-l: 1.45;
  --lh-m: 1.65;
  --lh-s: 1.5;
  --bg: #f3f4f6;
  --surface: #ffffff;
  --surface-raised: #ffffff;
  --text: #202528;
  --dim: #646c72;
  --border: #d8dde0;
  --accent: #0d6b6b;
  --accent-strong: #0d6b6b;
  --accent-soft: #dcebea;
  --on-accent: #ffffff;
  --danger: #b42332;
  --wine-red: #782f3a;
  --wine-white: #c49a45;
  --wine-sparkling: #8b7b3f;
  --wine-rose: #b96672;
  --wine-orange: #b66732;
  --wine-dessert: #956f24;
  --wine-fortified: #684149;
  --photo-bg: #e7e3df;
  --disclosure-bg: #e9f1f1; /* 펼친 제목 줄 배경 */
  --radius: 10px;
  --card-radius: 16px;
  --card-pad: 20px;
  --space-surface: var(--surface);
  --space-surface-alt: var(--surface-raised);
  --space-muted: var(--dim);
  --space-border: var(--border);
  --space-accent: var(--accent);
  font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  font-size: var(--fs-m);
  line-height: 1.6;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141719;
    --surface: #1d2225;
    --surface-raised: #23292c;
    --text: #f2f4f5;
    --dim: #abb3b8;
    --border: #394146;
    --accent: #62bdbc;
    --accent-strong: #62bdbc;
    --accent-soft: #203f40;
    --on-accent: #0b2526;
    --danger: #ff9da8;
    --wine-red: #a14f5c;
    --wine-white: #d4ad5b;
    --wine-sparkling: #b8a359;
    --wine-rose: #d7818b;
    --wine-orange: #d98249;
    --wine-dessert: #bd9340;
    --wine-fortified: #98646d;
    --photo-bg: #292d2f;
    --disclosure-bg: #22302f;
  }
}

* { box-sizing: border-box; }
html {
  height: auto;
  min-height: 100%;
  background: var(--bg);
  overscroll-behavior-y: none;
}
body {
  height: auto;
  min-height: calc(100dvh + 1px);
  margin: 0;
  min-width: 320px;
  overflow-x: clip;
  background: var(--bg);
  color: var(--text);
  font-size: var(--fs-m);
  line-height: 1.6;
  word-break: keep-all;
  overscroll-behavior-y: none;
}
[data-generated-space-root] {
  position: static;
  inset: auto;
  height: auto;
  min-height: 100dvh;
  overflow: visible;
  overscroll-behavior-y: none;
}
.hatch-space-root[data-hatch-space-root] {
  height: auto;
  min-height: 100dvh;
  overflow: visible;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--accent) 30%, transparent);
  outline-offset: 2px;
}
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

.app-shell {
  position: relative;
  min-height: 100dvh;
  overflow: visible;
  overflow-anchor: none;
  background: var(--bg);
  overscroll-behavior-y: none;
}
.page-wrap {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 36px);
}
.hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 0 22px;
  border-bottom: 1px solid var(--border);
}
.hero-count { margin: 0 0 2px; color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); }
.hero-count span { color: var(--accent); font-size: var(--fs-l); font-weight: 750; margin-right: 2px; }
.hero h1 { margin: 0; font-size: var(--fs-xl); line-height: var(--lh-xl); letter-spacing: -0.02em; font-weight: 760; }
.primary-button {
  min-height: 46px;
  border: 0;
  border-radius: var(--radius);
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 700;
  padding: 0 18px;
  cursor: pointer;
}
.primary-button:active { opacity: .86; }
.primary-button:disabled { opacity: .52; cursor: default; }
.primary-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.hero-button { display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; }

.state-panel, .empty-state {
  min-height: 52vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 44px 16px;
}
.state-panel h2, .empty-state h2 { margin: 16px 0 6px; font-size: var(--fs-xl); line-height: var(--lh-xl); letter-spacing: -.02em; }
.state-panel p, .empty-state p { max-width: 340px; margin: 0 0 22px; color: var(--dim); font-size: var(--fs-m); line-height: var(--lh-m); }
.loader { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 10px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .loader { animation: none; border-color: var(--accent); } }
.empty-bottle { position: relative; width: 74px; height: 110px; margin-bottom: 8px; filter: drop-shadow(0 8px 8px color-mix(in srgb, #000 14%, transparent)); }
.bottle-neck { position: absolute; left: 29px; top: 0; width: 16px; height: 31px; background: var(--wine-red); border-radius: 3px 3px 0 0; }
.bottle-neck::after { content: ""; position: absolute; left: -2px; top: 5px; width: 20px; height: 5px; background: #3e292d; border-radius: 2px; }
.bottle-body { position: absolute; left: 15px; bottom: 0; width: 44px; height: 83px; background: var(--wine-red); border-radius: 14px 14px 6px 6px; }
.bottle-body::before { content: ""; position: absolute; inset: 8px auto 8px 8px; width: 5px; border-radius: 3px; background: color-mix(in srgb, #fff 16%, transparent); }
.bottle-body::after { content: ""; position: absolute; left: 7px; top: 27px; width: 30px; height: 27px; background: #f2ece1; border-top: 4px solid #c9b995; border-radius: 2px; }
.text-button { border: 0; background: transparent; color: var(--accent); font-weight: 700; cursor: pointer; padding: 8px 4px; }

.summary-strip { display: grid; grid-template-columns: repeat(3, 1fr); padding: 18px 0; border-bottom: 1px solid var(--border); }
.summary-strip div { display: flex; flex-direction: column; gap: 1px; padding: 0 14px; border-right: 1px solid var(--border); }
.summary-strip div:first-child { padding-left: 0; }
.summary-strip div:last-child { border-right: 0; }
.summary-strip strong { color: var(--accent); font-size: var(--fs-xl); line-height: var(--lh-xl); font-weight: 760; }
.summary-strip span { color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); }
.collection { padding-top: 24px; }
.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
.section-heading h2 { margin: 0; font-size: var(--fs-l); line-height: var(--lh-l); letter-spacing: -.01em; font-weight: 750; }
.sort-control select {
  appearance: none;
  border: 0;
  background-color: transparent;
  color: var(--dim);
  padding: 7px 19px 7px 4px;
  font-size: var(--fs-s);
  line-height: var(--lh-s);
  font-weight: 650;
  background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%);
  background-position: calc(100% - 8px) 50%, calc(100% - 4px) 50%;
  background-size: 4px 4px, 4px 4px;
  background-repeat: no-repeat;
}
.status-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; margin-bottom: 10px; border-radius: var(--radius); background: color-mix(in srgb, var(--border) 58%, transparent); }
.status-tabs button { min-height: 38px; border: 0; border-radius: 7px; background: transparent; color: var(--dim); font-size: var(--fs-s); font-weight: 700; cursor: pointer; }
.status-tabs button.active { background: var(--surface); color: var(--accent); box-shadow: 0 1px 2px color-mix(in srgb, var(--text) 10%, transparent); }
.search-box { height: 46px; display: flex; align-items: center; gap: 9px; padding: 0 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; }
.search-box > svg { width: 18px; height: 18px; fill: none; stroke: var(--dim); stroke-width: 1.8; }
.search-box input { min-width: 0; flex: 1; border: 0; background: transparent; color: var(--text); outline: 0; font-size: var(--fs-m); }
.search-box input::placeholder { color: var(--dim); }
.search-box button { border: 0; background: transparent; padding: 4px; color: var(--dim); }
.search-box button svg, .icon-button svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.wine-list { border-top: 1px solid var(--border); }
.wine-row {
  width: 100%;
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr) 18px;
  gap: 12px;
  align-items: center;
  text-align: left;
  border: 0;
  border-bottom: 1px solid var(--border);
  background: transparent;
  padding: 15px 0;
  cursor: pointer;
}
.wine-row:active { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.wine-thumb {
  width: 64px;
  height: 80px;
  border-radius: 9px;
  overflow: hidden;
  display: grid;
  place-items: center;
  background: var(--photo-bg);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text) 7%, transparent);
}
.wine-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 62%;
}
.wine-mark {
  display: inline-grid;
  place-items: center;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--wine-red);
  flex: 0 0 auto;
}
.wine-thumb .wine-mark {
  width: 29px;
  height: 49px;
  border-radius: 9px 9px 6px 6px;
  position: relative;
  margin-top: 7px;
  box-shadow: 0 5px 10px color-mix(in srgb, #000 22%, transparent);
}
.wine-thumb .wine-mark::before {
  content: "";
  position: absolute;
  width: 11px;
  height: 14px;
  left: 9px;
  top: -11px;
  background: inherit;
  border-radius: 2px 2px 0 0;
}
.wine-thumb .wine-mark::after {
  content: "";
  position: absolute;
  width: 15px;
  height: 3px;
  left: 7px;
  top: -8px;
  background: color-mix(in srgb, var(--text) 30%, #161616);
  border-radius: 1px;
}
.wine-mark-label {
  display: none;
}
.wine-thumb .wine-mark-label {
  display: block;
  width: 20px;
  height: 18px;
  border-radius: 2px;
  background: #f2ece1;
  border-top: 3px solid color-mix(in srgb, currentColor 40%, #c9b995);
  opacity: .96;
}
.wine-mark--red { background: var(--wine-red); }
.wine-mark--white { background: var(--wine-white); }
.wine-mark--sparkling { background: var(--wine-sparkling); }
.wine-mark--rose { background: var(--wine-rose); }
.wine-mark--orange { background: var(--wine-orange); }
.wine-mark--dessert { background: var(--wine-dessert); }
.wine-mark--fortified { background: var(--wine-fortified); }
.wine-row-copy { min-width: 0; }
.wine-row-top { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); margin-bottom: 4px; }
.record-status { display: inline-flex; align-items: center; min-height: 20px; padding: 1px 6px; border-radius: 4px; font-size: var(--fs-s); line-height: var(--lh-s); font-weight: 750; color: var(--accent); background: var(--accent-soft); }
.record-status.researched { color: var(--accent); background: var(--accent-soft); }
.wine-kind { color: var(--dim); font-weight: 650; }
.wine-date::before { content: "·"; margin-right: 7px; }
.wine-row h3 { margin: 0; color: var(--accent); font-size: var(--fs-l); line-height: var(--lh-l); letter-spacing: -.01em; font-weight: 750; overflow-wrap: anywhere; }
.wine-row p { margin: 3px 0 0; color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); overflow-wrap: anywhere; }
.rating { display: inline-flex; align-items: center; gap: 4px; margin-top: 5px; color: var(--text); font-size: var(--fs-m); line-height: var(--lh-m); font-weight: 700; }
.rating::before { content: "★"; color: var(--accent); }
.wine-row .research-glance { margin-top: 5px; color: var(--text); font-size: var(--fs-m); font-weight: 650; }
.row-arrow svg { width: 18px; height: 18px; fill: none; stroke: var(--dim); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.no-results { text-align: center; color: var(--dim); padding: 42px 12px; font-size: var(--fs-m); }
.no-results p { margin: 0 0 4px; }

.sheet {
  position: relative;
  z-index: 20;
  min-height: 100%;
  overflow: visible;
  background: var(--bg);
  color: var(--text);
}
.sheet-bar {
  position: sticky;
  top: 0;
  z-index: 5;
  min-height: calc(env(safe-area-inset-top) + 58px);
  padding: calc(env(safe-area-inset-top) + 8px) max(18px, calc((100% - 560px) / 2 + 18px)) 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.icon-button { width: 42px; height: 42px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 50%; cursor: pointer; }
.detail-page, .form-body { width: 100%; max-width: 560px; margin: 0 auto; padding: 22px 18px calc(env(safe-area-inset-bottom) + 38px); }
.detail-photo-frame {
  width: min(100%, 400px);
  aspect-ratio: 4 / 5;
  display: grid;
  place-items: center;
  margin: 0 auto 24px;
  padding: 12px;
  overflow: hidden;
  border-radius: 12px;
  background: var(--photo-bg);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text) 8%, transparent), 0 8px 24px color-mix(in srgb, #000 11%, transparent);
}
.detail-photo {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 6px;
}
.detail-lead { padding: 4px 0 22px; border-bottom: 1px solid var(--border); }
.detail-meta { display: flex; align-items: center; gap: 7px; color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); margin-bottom: 8px; }
.detail-meta .wine-mark { width: 9px; height: 9px; }
.detail-lead h2 { margin: 0; color: var(--accent); font-size: var(--fs-xl); line-height: var(--lh-xl); letter-spacing: -.02em; overflow-wrap: anywhere; }
.detail-section { padding: 22px 0; border-bottom: 1px solid var(--border); }
.detail-section h3 { margin: 0 0 14px; font-size: var(--fs-l); line-height: var(--lh-l); font-weight: 750; letter-spacing: -.01em; }
.detail-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.detail-heading h3 { margin: 0; }
.detail-heading > span { color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); }
.detail-bullets { display: grid; gap: 11px; margin: 0; padding: 0 0 0 18px; }
.detail-bullets li { padding-left: 2px; color: var(--accent); }
.detail-bullets li::marker { font-size: var(--fs-s); }
.detail-bullets li > strong { display: block; margin-bottom: 1px; color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); }
.detail-bullets li > span { display: block; color: var(--text); font-size: var(--fs-m); line-height: var(--lh-m); white-space: pre-wrap; overflow-wrap: anywhere; }
.verdict-judgment { margin: 0; color: var(--text); font-size: var(--fs-l); font-weight: 750; line-height: var(--lh-l); }
.verdict-evidence { margin-top: 16px; }
.verdict-evidence h4 { margin: 0 0 8px; color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); }
.verdict-list li > span { font-weight: 500; }
.detail-bullets > .taste-item { color: transparent; }
.detail-bullets > .taste-item > strong { color: var(--dim); }
.detail-bullets > .taste-item > ul { display: grid; gap: 6px; margin: 4px 0 0; padding-left: 17px; }
.detail-bullets > .taste-item > ul li { color: var(--text); padding-left: 2px; font-size: var(--fs-m); line-height: var(--lh-m); }
.detail-bullets .rating { margin-top: 0; font-size: var(--fs-m); }
.detail-empty { color: var(--dim); padding: 24px 0; font-size: var(--fs-m); line-height: var(--lh-m); }
.danger-zone { padding: 30px 0 8px; text-align: center; }
.delete-link { border: 0; background: transparent; color: var(--danger); padding: 10px; cursor: pointer; font-size: var(--fs-m); }
.delete-confirm { padding: 16px; border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--border)); background: var(--surface); border-radius: var(--radius); }
.delete-confirm p { margin: 0 0 12px; font-weight: 700; }
.delete-confirm div { display: flex; gap: 8px; }
.delete-confirm button { flex: 1; min-height: 44px; border: 1px solid var(--border); background: transparent; border-radius: 8px; cursor: pointer; }
.delete-confirm button:last-child { border-color: var(--danger); background: var(--danger); color: #fff; }
.delete-confirm span { display: block; margin-top: 8px; color: var(--danger); font-size: var(--fs-s); }

.form-sheet form { min-height: 100%; }
.form-bar { display: grid; grid-template-columns: 44px 1fr 58px; }
.form-bar h2 { margin: 0; text-align: center; font-size: var(--fs-xl); line-height: var(--lh-xl); letter-spacing: -.02em; }
.save-button { border: 0; background: transparent; color: var(--accent); font-weight: 750; padding: 8px 0; cursor: pointer; }
.save-button:disabled { opacity: .52; }
.form-body { padding-top: 4px; }
.form-section { padding: 22px 0; border-bottom: 1px solid var(--border); }
.form-section:last-of-type { border-bottom: 0; }
.form-section h3 { margin: 0 0 14px; font-size: var(--fs-l); line-height: var(--lh-l); font-weight: 750; }
.status-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.status-choice button { min-height: 76px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); text-align: left; cursor: pointer; }
.status-choice button strong { font-size: var(--fs-l); line-height: var(--lh-l); }
.status-choice button span { color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); }
.status-choice button.active { border-color: var(--accent); background: var(--accent-soft); }
.status-choice button.active strong, .status-choice button.active.researched strong { color: var(--accent); }
.research-form-section, .research-section { border-top: 0; }
.photo-section { display: flex; flex-direction: column; align-items: center; }
.photo-picker { width: min(100%, 240px); aspect-ratio: 4 / 5; border: 1px dashed var(--border); border-radius: 12px; background: var(--photo-bg); position: relative; overflow: hidden; display: grid; place-items: center; color: var(--dim); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text) 4%, transparent); }
.photo-picker.has-photo { border-style: solid; }
.photo-picker > div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: var(--fs-s); font-weight: 650; }
.photo-picker > div svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.photo-picker img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }
.photo-picker label { position: absolute; inset: 0; cursor: pointer; }
.photo-picker label input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.photo-picker label span { position: absolute; bottom: 8px; left: 8px; right: 8px; min-height: 34px; display: grid; place-items: center; color: #fff; background: color-mix(in srgb, #000 72%, transparent); border-radius: 7px; font-size: var(--fs-s); font-weight: 700; }
.remove-photo { border: 0; background: transparent; color: var(--danger); margin-top: 8px; padding: 7px; font-size: var(--fs-s); cursor: pointer; }
.field { display: block; margin-top: 16px; }
.field:first-of-type { margin-top: 0; }
.field > span { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); font-weight: 700; }
.field > span b { color: var(--accent); font-size: var(--fs-s); font-weight: 700; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-raised); color: var(--text); padding: 10px 11px; font-size: var(--fs-m); line-height: var(--lh-m); outline: 0; }
.field input, .field select { min-height: 46px; }
.field textarea { resize: vertical; }

  background: color-mix(in srgb, var(--wine-white) 18%, var(--surface));
  color: color-mix(in srgb, var(--wine-white) 55%, var(--text));
  font-size: var(--fs-s);
  line-height: var(--lh-s);
  font-weight: 750;
  white-space: nowrap;
}
.local-note { margin: 0 0 2px; color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); }
.danger-zone .text-button { display: block; margin: 0 auto 14px; }
.delete-confirm .delete-hint { margin: -6px 0 12px; color: var(--dim); font-size: var(--fs-s); font-weight: 500; line-height: var(--lh-s); }
.state-panel[role="status"] p { margin-top: 6px; }

/* Wine type filter */
.type-filter {
  display: flex;
  gap: 6px;
  margin: -4px -18px 14px;
  padding: 2px 18px 4px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.type-filter::-webkit-scrollbar { display: none; }
.type-filter button {
  flex: 0 0 auto;
  min-height: 36px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--text);
  font-size: var(--fs-s);
  font-weight: 700;
  cursor: pointer;
}
.type-filter button b { color: var(--dim); font-weight: 650; }
.type-filter button .wine-mark { width: 10px; height: 10px; }
.type-filter button.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.type-filter button.active b { color: var(--accent); }
@media (max-width: 420px) {
  .type-filter { margin-left: -15px; margin-right: -15px; padding-left: 15px; padding-right: 15px; }
}


/* Lighter list and notes layout (type scale refresh) */
.hero { padding: 8px 0 18px; border-bottom: 0; align-items: center; }
.hero-note { margin-top: 2px; }
.hero-button { min-height: 40px; padding: 0 14px; border-radius: var(--radius); font-size: var(--fs-m); }
.hero-button svg { width: 16px; height: 16px; }
.collection { padding-top: 0; }
.results-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 6px; color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); }
.results-bar .sort-control select { padding-right: 18px; }
.wine-row { align-items: center; }
.wine-row-top { flex-wrap: wrap; gap: 4px 8px; }
.wine-row-top .wine-kind { display: inline-flex; align-items: center; gap: 5px; }
.wine-row-top .wine-mark { width: 8px; height: 8px; }
.wine-vintage { color: var(--dim); font-variant-numeric: tabular-nums; }
.wine-vintage::before { content: "·"; margin-right: 8px; }
.wine-row h3 { color: var(--text); font-weight: 700; }
.wine-row p { margin-top: 2px; }
.wine-row .row-arrow svg { width: 16px; height: 16px; }
@media (max-width: 420px) {
  .hero h1 { font-size: var(--fs-xl); }
}


/* 카드 규칙 (와인 노트): 카드 머리 + ＋ 줄. 펼치면 －, 제목 줄 배경, 왼쪽 컬러바, 제목이 탭 줄 아래에 붙는다 */
.notes-page { --stick: 56px; }
.notes-kinds {
  position: sticky;
  top: 0;
  z-index: 4;
  display: flex;
  gap: 8px;
  margin: 0 -18px 8px;
  padding: 8px 18px;
  background: var(--bg);
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.notes-kinds::-webkit-scrollbar { display: none; }
.notes-kinds button {
  flex: 0 0 auto;
  min-height: 40px;
  padding: 0 16px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--dim);
  font-size: var(--fs-s);
  line-height: var(--lh-s);
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}
.notes-kinds button.active { border-color: var(--accent-soft); background: var(--accent-soft); color: var(--accent); }
.notes-kinds button b { margin-left: 6px; color: var(--dim); font-weight: 650; }
.notes-kinds button.active b { color: var(--accent); }
.fold-card {
  overflow: clip;
  border: 1px solid var(--border);
  border-radius: var(--card-radius);
  background: var(--surface);
}
.fold-head { padding: var(--card-pad); border-bottom: 1px solid var(--border); }
.fold-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.fold-title h2 { min-width: 0; margin: 0; font-size: var(--fs-l); line-height: var(--lh-l); font-weight: 700; letter-spacing: -.01em; overflow-wrap: anywhere; }
.count-badge { flex: 0 0 auto; padding: 2px 10px; border-radius: 999px; background: color-mix(in srgb, var(--border) 55%, var(--surface)); color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); font-weight: 700; }
.fold-head p { margin: 6px 0 0; color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); }
.note-item { scroll-margin-top: var(--stick); }
.note-item + .note-item { border-top: 1px solid var(--border); }
.fold-row {
  width: 100%;
  min-height: 52px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px var(--card-pad);
  border: 0;
  background: var(--surface);
  color: var(--text);
  text-align: left;
  cursor: pointer;
}
.fold-row-copy { min-width: 0; flex: 1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.fold-row-copy strong { font-size: var(--fs-m); line-height: var(--lh-m); font-weight: 700; overflow-wrap: anywhere; }
.fold-row-copy small { color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); overflow-wrap: anywhere; }
.fold-sign { flex: 0 0 auto; display: grid; place-items: center; width: 24px; height: 24px; color: var(--dim); }
.fold-sign svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
/* 펼친 노트 줄: 카드 폭 전체 배경 + 펼친 범위 왼쪽 끝 컬러바 */
.note-item.open { box-shadow: inset 3px 0 0 var(--accent); }
.note-item.open > .fold-row {
  position: sticky;
  top: var(--stick);
  z-index: 3;
  background: var(--disclosure-bg);
  box-shadow: inset 3px 0 0 var(--accent), 0 1px 0 var(--border);
}
.note-content { padding: 14px var(--card-pad) var(--card-pad); }
/* 전체 보기에서 묶음이 바뀌는 곳의 회색 이름표 */
.note-group-label { padding: 12px var(--card-pad) 4px; color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); font-weight: 700; }
.note-item + .note-group-label { border-top: 1px solid var(--border); }
.note-linked-wines { margin: 0; }
.note-pages > .pinch-image:first-child { margin-top: 16px; }
.pinch-image.is-pending { display: none; }
.note-linked-wines h3 { margin: 0 0 4px; color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); font-weight: 700; }
.note-linked-wines > p { margin: 0; color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); }
.note-linked-wine-list > button {
  width: 100%;
  min-height: 56px;
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr) auto 14px;
  gap: 12px;
  align-items: center;
  padding: 8px 0;
  border: 0;
  border-bottom: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  text-align: left;
  cursor: pointer;
}
.note-linked-wine-list img,
.linked-wine-mark { width: 36px; height: 44px; border-radius: 5px; object-fit: cover; object-position: center 62%; background-color: var(--photo-bg); }
.linked-wine-mark { display: block; }
.note-linked-wine-list > button > span:nth-child(2) { min-width: 0; display: grid; }
.note-linked-wine-list strong { font-size: var(--fs-m); line-height: var(--lh-m); font-weight: 700; overflow-wrap: anywhere; }
.note-linked-wine-list small, .linked-wine-year { color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); }
.linked-wine-year { font-variant-numeric: tabular-nums; }
.linked-wine-arrow { color: var(--dim); font-size: var(--fs-l); line-height: var(--lh-l); text-align: center; }
.notes-card .no-results { padding: 32px var(--card-pad); }
@media (max-width: 420px) {
  .notes-kinds { margin-left: -15px; margin-right: -15px; padding-left: 15px; padding-right: 15px; }
}

/* 화면 맨 위 제목: 작게, 가운데, 양옆 두 줄 장식. 위에 고정하지 않는다 */
.brand-page, .notes-page { padding-top: env(safe-area-inset-top); }
.brand-row { display: flex; justify-content: center; margin: 0 0 12px; padding: 12px 0 0; }
.brand-row h1 {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0;
  color: var(--text);
  font-size: var(--fs-l);
  line-height: var(--lh-l);
  font-weight: 700;
  letter-spacing: .04em;
}
.brand-row h1::before,
.brand-row h1::after { content: ""; width: 36px; height: 4px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }

/* 와인 기록: 노트와 같은 알약 탭 + 카드 한 장. 와인 줄은 가는 선으로 나눈다 */
.brand-page .collection { padding-top: 0; }
.brand-page .search-box { margin-bottom: 8px; }
.type-filter {
  position: sticky;
  top: 0;
  z-index: 4;
  gap: 8px;
  margin: 0 -18px 8px;
  padding: 8px 18px;
  background: var(--bg);
}
.type-filter button { min-height: 40px; padding: 0 14px; color: var(--dim); }
.type-filter button.active { border-color: var(--accent-soft); }
.wine-card .results-bar { margin: 6px 0 0; }
.wine-card .results-bar > span { min-width: 0; }
.wine-card .wine-list { display: block; margin: 0; }
.wine-card .wine-list-entry + .wine-list-entry { margin-top: 0; border-top: 1px solid var(--border); }
.wine-year { padding: 12px var(--card-pad) 0; color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); font-weight: 700; }
.wine-card .wine-row {
  width: 100%;
  min-height: 72px;
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) auto;
  gap: 14px;
  align-items: center;
  padding: 12px var(--card-pad);
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  color: var(--text);
  text-align: left;
}
.wine-card .wine-row:active { background: color-mix(in srgb, var(--border) 30%, transparent); }
.wine-card .wine-thumb {
  width: 40px;
  height: 56px;
  border-radius: 4px;
  box-shadow: 0 1px 3px color-mix(in srgb, #000 18%, transparent);
}
.wine-card .wine-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: center 55%; border-radius: inherit; }
.wine-row-copy { min-width: 0; display: grid; gap: 2px; }
.wine-row-name { font-size: var(--fs-m); line-height: var(--lh-s); font-weight: 700; overflow-wrap: anywhere; }
.wine-row-meta { color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); overflow-wrap: anywhere; }
.wine-row-meta .wine-mark { display: inline-block; width: 8px; height: 8px; margin-right: 6px; vertical-align: 1px; }
.wine-row-meta .local-badge { margin-left: 6px; }
.wine-row-side { align-self: start; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding-top: 1px; }
.wine-row-date { color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); font-variant-numeric: tabular-nums; white-space: nowrap; }
.wine-card .no-results { padding: 32px var(--card-pad); }
@media (max-width: 420px) {
  .type-filter { margin-left: -15px; margin-right: -15px; padding-left: 15px; padding-right: 15px; }
}

/* 상세 점수: 상자 대신 가는 선으로 나눈 줄 */
.scores-list { gap: 0; border-top: 1px solid var(--border); }
.score-row,
.score-row.vivino-score { min-height: 0; padding: 12px 0; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; background: transparent; box-shadow: none; }

/* 와인 기록: ＋ 줄을 펼치면 안쪽 내용이 그 자리에서 열린다 (첫 단계: 카드 폭 배경 + 컬러바, 안쪽 단계: 회색 안내선) */
.brand-page { --stick: 56px; }
.wine-item { scroll-margin-top: var(--stick); }
.wine-item.open { box-shadow: inset 3px 0 0 var(--accent); }
.wine-card .wine-item.open > .wine-row {
  position: sticky;
  top: var(--stick);
  z-index: 3;
  background: var(--disclosure-bg);
  box-shadow: inset 3px 0 0 var(--accent), 0 1px 0 var(--border);
}
.wine-row-side .fold-sign { width: 20px; height: 20px; }
.wine-body { padding: 14px var(--card-pad) var(--card-pad); }
.wine-photo { height: 260px; margin-bottom: 16px; border-radius: 8px; overflow: hidden; background: var(--photo-bg); }
.wine-photo .pinch-image,
.wine-photo .pinch-image-frame,
.wine-photo img { background: transparent; border: 0; }
.wine-photo .pinch-image--contain img { padding: 0; }
.wine-verdict { margin: 0 0 16px; font-size: var(--fs-m); line-height: var(--lh-m); }
.wine-facts { display: grid; gap: 6px; margin: 0; }
.wine-facts .fact { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: baseline; }
.wine-facts .fact dt { margin: 0; color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); font-weight: 700; }
.wine-facts .fact dd { margin: 0; font-size: var(--fs-m); line-height: var(--lh-m); }
.wine-prose { margin: 0; font-size: var(--fs-m); line-height: var(--lh-m); white-space: pre-wrap; }
.wine-sections { margin-top: 16px; border-top: 1px solid var(--border); }
.wine-section + .wine-section { border-top: 1px solid var(--border); }
.wine-section { scroll-margin-top: calc(var(--stick) + var(--row-h, 72px)); }
.wine-section > .fold-row { padding: 12px 0; background: transparent; }
.wine-section.open > .fold-row {
  position: sticky;
  top: calc(var(--stick) + var(--row-h, 72px));
  z-index: 2;
  width: calc(100% + 2 * var(--card-pad));
  margin: 0 calc(-1 * var(--card-pad));
  padding: 12px var(--card-pad);
  background: var(--disclosure-bg);
  box-shadow: inset 3px 0 0 var(--accent), 0 1px 0 var(--border);
}
.wine-section-body { margin: 4px 0 12px; padding: 8px 0 8px 14px; border-left: 2px solid var(--border); }
.wine-section-body .scores-list { border-top: 0; }
.wine-section-body .score-row:last-child { border-bottom: 0; }
.wine-section-body .score-row:first-child { padding-top: 0; }
.wine-actions { margin-top: 16px; text-align: center; }
.wine-action-row { display: flex; justify-content: flex-end; gap: 8px; }
.wine-action-row .text-button, .wine-action-row .delete-link { min-height: 44px; padding: 0 12px; font-size: var(--fs-s); }
.wine-actions .delete-confirm { text-align: left; }
.linked-wine-mark { background-color: var(--photo-bg); }
/* 통합 검색: 검색 중에는 알약 줄이 없으니 펼친 제목이 화면 맨 위에 붙는다 */
main.is-searching { --stick: 0px; }
#tab-body > .fold-card + .fold-card { margin-top: 16px; }

/* 당겨서 새로고침 표시: 화면 위에서 당긴 만큼 내려온다 */
.pull-refresh {
  position: fixed;
  z-index: 30;
  top: env(safe-area-inset-top);
  left: 50%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  box-shadow: 0 4px 14px color-mix(in srgb, #000 12%, transparent);
  color: var(--dim);
  font-size: var(--fs-s);
  line-height: var(--lh-s);
  font-weight: 700;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, calc(var(--pull, 0px) - 100%));
  transition: transform .2s ease, opacity .2s ease;
}
.pull-refresh[data-state="pull"],
.pull-refresh[data-state="ready"] { opacity: 1; transition: none; }
.pull-refresh[data-state="ready"],
.pull-refresh[data-state="loading"] { opacity: 1; color: var(--accent); }
.pull-refresh-icon { display: grid; place-items: center; }
.pull-refresh svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pull-refresh[data-state="loading"] .pull-refresh-icon { animation: spin .8s linear infinite; }
@media (prefers-reduced-motion: reduce) {
  .pull-refresh[data-state="loading"] .pull-refresh-icon { animation: none; }
}

/* 카드 머리 없이: 첫 줄에 첫 연도와 정렬 메뉴 */
.wine-list-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px var(--card-pad) 0; }
.wine-list-head .wine-year { padding: 0; }
.wine-list-head .sort-control select { padding-top: 4px; padding-bottom: 4px; font-size: var(--fs-s); line-height: var(--lh-s); }
.wine-rate-date { margin: 10px 0 0; color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); }
/* 펼친 노트의 자세한 내용: 회색 이름표 아래 본문 */
/* 글 항목(공통): 노트 자세한 내용, 와인 시음 노트 */
/* 항목 이름은 왼쪽 64px 칸(회색 굵은 14px), 본문은 오른쪽. 기본 정보(.wine-facts)와 같은 칸 너비 */
.text-items { display: grid; gap: 16px; margin: 0; }
.text-items > div { min-width: 0; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: baseline; }
.text-items dt { color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); font-weight: 700; word-break: keep-all; }
.text-items dd { margin: 0; font-size: var(--fs-m); line-height: var(--lh-m); overflow-wrap: anywhere; }
.text-items .taste-bars { gap: 6px; }
.text-items .taste-bar-row { grid-template-columns: 32px minmax(0, 1fr) 12px; gap: 10px; }
.text-items .taste-bar-row > span,
.text-items .taste-bar-row > b { color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); font-weight: 400; }
.text-items .taste-track { height: 6px; border-radius: 3px; }
.text-items + .note-linked-wines { margin-top: 20px; }
.note-group-label:first-child { padding-top: 14px; }

/* 시음 노트 안의 맛 막대: 이름표는 다른 회색 이름표와 같게, 글과는 한 칸 띄운다 */
.wine-section-body .taste-bars { gap: 10px; }
.wine-section-body .taste-bar-row > span { color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); font-weight: 700; }
.wine-section-body .taste-bar-row > b { color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); font-weight: 650; }

.search-label { padding-bottom: 8px; border-bottom: 1px solid var(--border); }
/* 점수: 출처와 점수를 한 줄에, 나머지는 회색 한 줄 */
.score-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
.score-item:first-child { padding-top: 0; }
.score-item:last-child { padding-bottom: 0; border-bottom: 0; }
.score-line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.score-name { min-width: 0; font-size: var(--fs-m); line-height: var(--lh-m); font-weight: 700; overflow-wrap: anywhere; }
.score-value { flex: 0 0 auto; color: var(--accent); font-size: var(--fs-m); line-height: var(--lh-m); font-weight: 700; }
.score-info { margin: 2px 0 0; color: var(--dim); font-size: var(--fs-s); line-height: var(--lh-s); overflow-wrap: anywhere; }
/* 지역 · 품종 글 안의 노트 이름: 색만 바꾼다 */
.fact dd .inline-note-link { display: inline; padding: 0; border: 0; background: none; color: var(--accent); font: inherit; font-weight: inherit; text-align: inherit; cursor: pointer; }

/* 사진 아래 내 평가: 별점과 한줄평 */
.wine-mine { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 0 0 16px; }
.wine-mine .rating { margin: 0; color: var(--text); font-size: var(--fs-m); line-height: var(--lh-m); font-weight: 700; }
.wine-mine p { margin: 0; flex: 1 1 200px; font-size: var(--fs-m); line-height: var(--lh-m); }
.wine-section-body .wine-verdict { margin: 0 0 10px; }
/* 펼친 노트 안의 마셔 본 와인: 날짜 · 이름만, 카드 끝까지 이어진 선 */
.note-content.has-list { padding-bottom: 0; }

"use strict";
/* ================= helpers ================= */
function esc(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function cloneWine(wine) { return JSON.parse(JSON.stringify(wine)); }

const typeLabels = { red: "레드", white: "화이트", sparkling: "스파클링", rose: "로제", orange: "오렌지", dessert: "스위트", fortified: "주정강화" };

function formatDate(date) {
  const parts = String(date).split("-");
  if (!parts[0] || !parts[1] || !parts[2]) return date;
  return parts[0] + "." + Number(parts[1]) + "." + Number(parts[2]);
}
function formatFullDate(date) {
  const parts = String(date).split("-");
  if (!parts[0] || !parts[1] || !parts[2]) return String(date).replaceAll("-", ".");
  return parts[0] + "." + parts[1].padStart(2, "0") + "." + parts[2].padStart(2, "0");
}
function formatWon(amount) { return new Intl.NumberFormat("ko-KR").format(amount) + "원"; }
function vintageLabel(value) {
  const vintage = String(value).trim();
  const m = vintage.match(/^\s*(\d{4})\b/);
  return m ? m[1] : vintage;
}
function textBullets(value) {
  return String(value).split(/\n+/).map(function (line) { return line.replace(/^\s*[-•·]\s*/, "").trim(); }).filter(Boolean);
}
function normalizeText(value) {
  return String(value).toLocaleLowerCase("ko-KR").replace(/[\s·.,()\-_/]/g, "");
}
function wineMarkHTML(type) {
  return '<span class="wine-mark wine-mark--' + esc(type) + '" aria-hidden="true"><span class="wine-mark-label"></span></span>';
}
function starsHTML(rating) {
  return '<span class="rating" aria-label="평점 5점 만점에 ' + (rating / 2) + '점">' + (rating / 2).toFixed(1) + "</span>";
}

/* ================= wine study notes data ================= */
function notePage(kind, n) { return "assets/notes/" + kind + "/p-" + String(n).padStart(2, "0") + ".webp"; }
function makeNote(kind, pageNumber, title, subtitle, summary, aliases) {
  return { id: kind + "-" + pageNumber, kind: kind, title: title, subtitle: subtitle, summary: summary, aliases: aliases || [], pages: [notePage(kind, pageNumber)] };
}
let varietyNotes = [];
let regionNotes = [];
let basicNotes = [];
let allWineNotes = [];
/* 노트는 하단 탭(품종 · 산지 · 사전) → 위쪽 알약(묶음) → 노트 줄 */
const noteTabs = [
  { key: "varieties", label: "품종", title: "품종 노트", unit: "종" },
  { key: "regions", label: "산지", title: "산지 노트", unit: "곳" },
  { key: "basics", label: "사전", title: "와인 사전", unit: "개" }
];

const whiteVarieties = ["샤르도네", "소비뇽 블랑", "리슬링", "슈냉 블랑", "세미용", "비오니에", "게뷔르츠트라미너", "피노 그리", "알바리뇨", "그뤼너 벨트리너", "가르가네가", "모스카토", "팔로미노"];
/* 산지 노트 번호(p-NN) → 나라 */
function regionCountry(pageNumber) {
  if (pageNumber <= 16) return "프랑스";
  if (pageNumber <= 22) return "이탈리아";
  if (pageNumber <= 27) return "스페인";
  if (pageNumber <= 30) return "포르투갈";
  if (pageNumber <= 33) return "독일";
  if (pageNumber <= 35) return "오스트리아";
  if (pageNumber === 36) return "헝가리";
  if (pageNumber <= 39) return "미국";
  return { 40: "아르헨티나", 41: "칠레", 42: "호주", 43: "호주", 44: "뉴질랜드", 45: "남아공" }[pageNumber] || "";
}
let noteCollections = {};
let noteGroups = {}; /* tab key → [{ key, label, notes }] */
function buildNotes(src) {
  /* varietyRows: [title, english, summary, aliases, 레드|화이트]; regionRows: [page, title, english, summary, aliases, country] */
  varietyNotes = src.varietyRows.map(function (row, i) {
    const note = makeNote("varieties", i + 3, row[0], row[1], row[2], row[3].slice());
    note.group = row[4] || (whiteVarieties.indexOf(row[0]) === -1 ? "레드" : "화이트");
    return note;
  });
  regionNotes = src.regionRows.map(function (row) {
    const note = makeNote("regions", row[0], row[1], row[2], row[3], row[4].slice());
    note.group = row[5] || regionCountry(row[0]) || "기타";
    return note;
  });
  /* basicRows: [page, group, title, summary]. 예전 모양(basicTitles)도 읽는다 */
  const basicRows = src.basicRows || (src.basicTitles || []).map(function (title, i) {
    const n = i + 1;
    return [n + 4, n <= 10 ? "종류" : n <= 20 ? "맛과 향" : n <= 27 ? "" : n <= 38 ? "마시기" : "용어", title, (src.basicSummaries || {})[title] || ""];
  }).filter(function (row) { return row[1]; });
  basicNotes = basicRows.map(function (row) {
    const note = makeNote("basics", row[0], row[2], "", row[3]);
    note.group = row[1];
    return note;
  });
  allWineNotes = varietyNotes.concat(regionNotes, basicNotes);
  /* details: { kind: { title: [[label, text], …] } } */
  const details = src.details || {};
  allWineNotes.forEach(function (note) { note.details = (details[note.kind] || {})[note.title] || []; });
  noteCollections = { varieties: varietyNotes, regions: regionNotes, basics: basicNotes };
  noteMatchCache.clear();
  noteGroups = { varieties: groupNotes(varietyNotes), regions: groupNotes(regionNotes), basics: groupNotes(basicNotes) };
}
function groupNotes(notes) {
  const groups = [];
  notes.forEach(function (note) {
    let group = groups.find(function (g) { return g.key === note.group; });
    if (!group) { group = { key: note.group, label: note.group, notes: [] }; groups.push(group); }
    group.notes.push(note);
  });
  return groups;
}

/* 와인의 품종 · 지역 글에서 노트 이름이 나오는 자리를 찾는다(쁘띠 시라 > 시라처럼 긴 이름 우선).
   띄어쓰기 · 가운뎃점 · 괄호가 달라도 찾는다 */
const noteMatchCache = new Map();
function matchNotesInText(value, kind) {
  const text = String(value || "");
  const key = kind + "|" + text;
  if (noteMatchCache.has(key)) return noteMatchCache.get(key);
  const candidates = [];
  (kind === "varieties" ? varietyNotes : regionNotes).forEach(function (note) {
    [note.title, note.subtitle || ""].concat(note.aliases || []).forEach(function (name) {
      const chars = Array.from(normalizeText(name));
      if (chars.length < 2) return;
      const pattern = new RegExp(chars.map(function (c) { return c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("[\\s·.,()\\-_/]*"), "gi");
      let m;
      while ((m = pattern.exec(text))) candidates.push({ note: note, start: m.index, end: m.index + m[0].length, size: chars.length });
    });
  });
  /* 겹치면 긴 이름이 이기고, 같은 노트는 글에서 처음 나온 자리 하나만 */
  candidates.sort(function (a, b) { return b.size - a.size || a.start - b.start; });
  const kept = [];
  candidates.forEach(function (c) {
    if (!kept.some(function (k) { return c.start < k.end && c.end > k.start; })) kept.push(c);
  });
  kept.sort(function (a, b) { return a.start - b.start; });
  const picked = kept.filter(function (c, i) { return !kept.slice(0, i).some(function (k) { return k.note === c.note; }); });
  noteMatchCache.set(key, picked);
  return picked;
}
function findWineNotes(value, kind) {
  return matchNotesInText(value, kind).map(function (m) { return m.note; });
}
/* 글은 그대로 두고, 노트 이름 부분만 색으로 표시해 누르면 그 노트로 간다 */
function linkNotesInText(value, kind) {
  const text = String(value || "");
  let html = "";
  let at = 0;
  matchNotesInText(text, kind).forEach(function (m) {
    html += esc(text.slice(at, m.start))
      + '<button class="inline-note-link" data-action="open-note" data-note-id="' + m.note.id + '">' + esc(text.slice(m.start, m.end)) + "</button>";
    at = m.end;
  });
  return html + esc(text.slice(at));
}

/* ================= data & storage =================
   data/wines.json (in the repo) is the shared source of truth.
   localStorage only keeps this device's own changes on top of it,
   so wines added to the repo later always show up. */
const LOCAL_KEY = "wine-local-v2";
const LEGACY_KEY = "wine-records-v1";
const LEGACY_SEED_MAX_ID = 26; /* v1 stored a full copy of wines 1–26 */
let storageAvailable = true;
let loadState = "loading"; /* loading | ready | error */
let notesFailed = false; /* records still show when only the notes file fails */
let notesSource = ""; /* notes.json as last read, to spot changes */
let baseWines = [];
let local = { added: [], edited: {}, deleted: [] };
let wines = [];

function fetchJSON(url) {
  /* revalidate so new wines appear right away; fall back to cache when offline */
  return fetch(url, { cache: "no-cache" })
    .catch(function () { return fetch(url, { cache: "force-cache" }); })
    .then(function (res) {
      if (!res.ok) throw new Error(url + " " + res.status);
      return res.json();
    });
}
function isLocalId(id) { return String(id).indexOf("local-") === 0; }
function localState(wine) {
  if (isLocalId(wine.id)) return "added";
  return local.edited[String(wine.id)] ? "edited" : null;
}
function readLocal() {
  try {
    const raw = localStorage.getItem(LOCAL_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.added)) return null;
    return { added: parsed.added, edited: parsed.edited || {}, deleted: parsed.deleted || [] };
  } catch (e) {
    storageAvailable = false;
    return null;
  }
}
function migrateLegacy() {
  let legacy = null;
  try { legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || "null"); } catch (e) { return null; }
  if (!Array.isArray(legacy)) return null;
  const next = { added: [], edited: {}, deleted: [] };
  const byId = {};
  baseWines.forEach(function (w) { byId[String(w.id)] = w; });
  const kept = {};
  legacy.forEach(function (wine) {
    const original = byId[String(wine.id)];
    if (!original) {
      next.added.push(Object.assign({}, wine, { id: "local-" + wine.id }));
      return;
    }
    kept[String(wine.id)] = true;
    if (wine.updated_at === original.updated_at) return;
    /* seed photos were webp data URIs; an uploaded replacement is jpeg */
    const ownPhoto = !wine.photo_url || String(wine.photo_url).indexOf("data:image/jpeg") === 0;
    next.edited[String(wine.id)] = Object.assign({}, original, wine, ownPhoto ? {} : { photo_url: original.photo_url, photo_thumbnail_url: original.photo_thumbnail_url });
  });
  baseWines.forEach(function (w) {
    if (Number(w.id) <= LEGACY_SEED_MAX_ID && !kept[String(w.id)]) next.deleted.push(String(w.id));
  });
  return next;
}
function mergedWines() {
  const deleted = {};
  local.deleted.forEach(function (id) { deleted[String(id)] = true; });
  return local.added.concat(baseWines
    .filter(function (w) { return !deleted[String(w.id)]; })
    .map(function (w) { return local.edited[String(w.id)] || w; }));
}
function persist() {
  try {
    localStorage.setItem(LOCAL_KEY, JSON.stringify(local));
    storageAvailable = true;
    return true;
  } catch (e) {
    storageAvailable = false;
    return false;
  }
}
/* apply a change to the local layer; rolls back if storage is full */
function commitLocal(change) {
  const snapshot = cloneWine(local);
  change(local);
  if (!persist()) { local = snapshot; return false; }
  wines = mergedWines();
  return true;
}
/* 배포 직후에는 브라우저에 남은 예전 index.html(최대 10분)과 새 데이터가 안 맞을 수 있다.
   불러오기에 실패하면 주소를 바꿔 새 페이지로 한 번만 다시 연다 */
const RELOAD_KEY = "wine-fresh-reload";
const TAB_KEY = "wine-fresh-tab";
function reloadFresh() {
  try { sessionStorage.setItem(RELOAD_KEY, "1"); sessionStorage.setItem(TAB_KEY, activeTab); } catch (e) {}
  location.replace(location.pathname + "?r=" + Date.now());
}
function alreadyReloaded() {
  try { return sessionStorage.getItem(RELOAD_KEY) === "1"; } catch (e) { return true; }
}
function loadData() {
  loadState = "loading";
  render();
  Promise.all([
    fetchJSON("data/wines.json"),
    fetchJSON("data/notes.json").then(function (src) { buildNotes(src); notesSource = JSON.stringify(src); return true; }).catch(function () { return false; })
  ]).then(function (results) {
    if (!results[1] && !alreadyReloaded()) { reloadFresh(); return; }
    notesFailed = !results[1];
    baseWines = results[0];
    const stored = readLocal();
    if (stored) {
      local = stored;
    } else {
      const migrated = migrateLegacy();
      if (migrated) {
        local = migrated;
        if (persist()) { try { localStorage.removeItem(LEGACY_KEY); } catch (e) {} }
      }
    }
    wines = mergedWines();
    loadState = "ready";
    try {
      sessionStorage.removeItem(RELOAD_KEY);
      const tab = sessionStorage.getItem(TAB_KEY);
      sessionStorage.removeItem(TAB_KEY);
      if (tab && tab !== "records" && noteCollections[tab] && !notesFailed) { activeTab = tab; notesKind = tab; }
    } catch (e) {}
    if (location.search) history.replaceState(history.state, "", location.pathname);
    render({ restoreScroll: true });
    checkForNewVersion();
  }).catch(function () {
    if (!alreadyReloaded()) { reloadFresh(); return; }
    loadState = "error";
    render();
  });
}

const tabScroll = {};
let selectedId = null; /* the wine being edited / deleted (same as wineOpenId while one is open) */
let wineOpenId = null;
let wineOpenSection = null;
let formMode = null; /* "edit" while the edit form is open */
let searchText = "";
let sortMode = "recent";
let typeFilter = "all";
let collectionScroll = 1;
let detailScroll = 1;
let pendingScroll = 1;
let detailConfirmDelete = false;
let noteTarget = null;
let notesKind = "varieties"; /* the note tab on screen, kept in step with activeTab */
let notesGroupBy = { varieties: "all", regions: "all", basics: "all" };
let notesOpenId = null;
let form = null;
let formPhoto = null; /* null = unchanged; {photo_url, photo_thumbnail_url} = new photo; "removed" */
let formError = "";
let formSaving = false;
let formDirty = false;
let historyDepth = 0; /* history entries pushed for open detail/form sheets */

function getWine(id) { return wines.find(function (w) { return String(w.id) === String(id); }) || null; }
function localDateString() {
  const now = new Date();
  return now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
}

/* ================= pinch zoom image ================= */
/* 노트 쪽 이미지는 실제로 불러온 뒤에만 보인다. 없는 파일이면 테두리 상자가 잠깐 보였다 사라지지 않게 */
const loadedImages = new Set();
const missingImages = new Set();
function pinchZoomHTML(previewSrc, highResSrc, alt, fit) {
  fit = fit || "page";
  if (fit === "page" && missingImages.has(previewSrc)) return "";
  const pending = fit === "page" && !loadedImages.has(previewSrc);
  return '<div class="pinch-image pinch-image--' + fit + (pending ? " is-pending" : "") + '" data-preview="' + esc(previewSrc) + '" data-highres="' + esc(highResSrc || previewSrc) + '">'
    + '<div class="pinch-image-frame"><img src="' + esc(previewSrc) + '" loading="lazy" decoding="async" draggable="false" alt="' + esc(alt) + '" /></div>'
    + '<span class="pinch-image-hint" hidden></span>'
    + "</div>";
}
function setupPinchZoom(root) {
  const frame = root.querySelector(".pinch-image-frame");
  const img = root.querySelector("img");
  img.addEventListener("error", function () {
    if (root.classList.contains("is-zoomed")) return;
    /* 없는 이미지는 안내 문구 없이 통째로 뺀다 */
    root.remove();
  });
  if (root.classList.contains("is-pending")) {
    const src = root.getAttribute("data-preview");
    const probe = new Image();
    probe.onload = function () { loadedImages.add(src); root.classList.remove("is-pending"); };
    probe.onerror = function () { missingImages.add(src); root.remove(); };
    probe.src = src;
  }
  let statusEl = root.querySelector(".pinch-image-hint");
  let statusMode = "hint";
  const previewSrc = root.getAttribute("data-preview");
  const highResSrc = root.getAttribute("data-highres");
  let transform = { scale: 1, x: 0, y: 0 };
  let highResRequested = false;
  const pointers = new Map();
  let pinchStart = null;

  function render() {
    img.style.transform = "translate3d(" + transform.x + "px, " + transform.y + "px, 0) scale(" + transform.scale + ")";
    const zoomed = transform.scale > 1.01;
    root.classList.toggle("is-zoomed", zoomed);
    if (zoomed && statusMode !== "reset") {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "pinch-image-reset";
      btn.setAttribute("aria-label", "원래 크기로");
      btn.addEventListener("click", reset);
      statusEl.replaceWith(btn);
      statusEl = btn;
      statusMode = "reset";
    } else if (!zoomed && statusMode !== "hint") {
      const span = document.createElement("span");
      span.className = "pinch-image-hint";
      span.hidden = true;
      statusEl.replaceWith(span);
      statusEl = span;
      statusMode = "hint";
    }
    if (statusMode === "reset") statusEl.textContent = "원래 크기로 · " + Math.round(transform.scale * 100) + "%";
  }
  function applyTransform(next) {
    const scale = Math.min(5, Math.max(1, next.scale));
    if (scale <= 1.01) { transform = { scale: 1, x: 0, y: 0 }; render(); return; }
    const maxX = frame.clientWidth * (scale - 1) / 2;
    const maxY = frame.clientHeight * (scale - 1) / 2;
    transform = { scale: scale, x: Math.min(maxX, Math.max(-maxX, next.x)), y: Math.min(maxY, Math.max(-maxY, next.y)) };
    render();
  }
  function reset() { applyTransform({ scale: 1, x: 0, y: 0 }); }
  function requestHighResolution() {
    if (!highResSrc || highResSrc === img.getAttribute("src") || highResRequested) return;
    highResRequested = true;
    const loader = document.createElement("span");
    loader.className = "pinch-image-loading";
    loader.setAttribute("role", "status");
    loader.textContent = "고해상도 불러오는 중";
    root.appendChild(loader);
    const probe = new Image();
    probe.decoding = "async";
    probe.onload = function () { img.src = highResSrc; loader.remove(); };
    probe.onerror = function () { highResRequested = false; loader.remove(); };
    probe.src = highResSrc;
  }
  function distance(a, b) { return Math.hypot(b.x - a.x, b.y - a.y); }
  frame.addEventListener("pointerdown", function (event) {
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (pointers.size < 2) return;
    requestHighResolution();
    const pts = Array.from(pointers.values());
    pointers.forEach(function (_, id) { try { frame.setPointerCapture(id); } catch (e) {} });
    pinchStart = { distance: Math.max(1, distance(pts[0], pts[1])), center: { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 }, transform: { scale: transform.scale, x: transform.x, y: transform.y } };
  });
  frame.addEventListener("pointermove", function (event) {
    if (!pointers.has(event.pointerId)) return;
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (pointers.size < 2 || !pinchStart) return;
    const pts = Array.from(pointers.values());
    const ratio = distance(pts[0], pts[1]) / pinchStart.distance;
    const center = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
    applyTransform({ scale: pinchStart.transform.scale * ratio, x: pinchStart.transform.x + center.x - pinchStart.center.x, y: pinchStart.transform.y + center.y - pinchStart.center.y });
  });
  function pointerEnd(event) {
    pointers.delete(event.pointerId);
    try { frame.releasePointerCapture(event.pointerId); } catch (e) {}
    pinchStart = null;
    if (pointers.size >= 2) {
      const pts = Array.from(pointers.values());
      pinchStart = { distance: Math.max(1, distance(pts[0], pts[1])), center: { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 }, transform: { scale: transform.scale, x: transform.x, y: transform.y } };
    }
  }
  frame.addEventListener("pointerup", pointerEnd);
  frame.addEventListener("pointercancel", pointerEnd);
  frame.addEventListener("wheel", function (event) {
    if (!event.ctrlKey && !event.metaKey) return;
    event.preventDefault();
    requestHighResolution();
    applyTransform({ scale: transform.scale * Math.exp(-event.deltaY * 0.01), x: transform.x, y: transform.y });
  }, { passive: false });
  frame.addEventListener("dblclick", reset);
  void previewSrc;
}
function initPinchZooms(scope) {
  scope.querySelectorAll(".pinch-image").forEach(setupPinchZoom);

/* ================= collection view ================= */
function wineMatches(wine, needle) {
  return [wine.name, wine.producer, wine.vintage, wine.country, wine.region, wine.grapes, wine.place, wine.my_comment, wine.personal_notes, wine.info_notes, wine.buy_verdict]
    .join(" ").toLocaleLowerCase("ko-KR").includes(needle);
}
function noteMatches(note, needle) {
  const detailText = (note.details || []).map(function (d) { return d[1]; });
  return normalizeText([note.title, note.subtitle || "", note.summary].concat(note.aliases || [], detailText).join(" ")).includes(needle);
}
function filteredWines() {
  const matched = wines.filter(function (wine) {
    return typeFilter === "all" || wine.wine_type === typeFilter;
  });
  matched.sort(function (a, b) {
    if (sortMode === "rating") return (b.rating || 0) - (a.rating || 0) || String(b.updated_at).localeCompare(String(a.updated_at));
    if (sortMode === "name") return a.name.localeCompare(b.name, "ko-KR");
    const aDate = a.consumed_date || a.updated_at;
    const bDate = b.consumed_date || b.updated_at;
    return String(bDate).localeCompare(String(aDate)) || String(b.created_at).localeCompare(String(a.created_at));
  });
  return matched;
}

/* 와인 한 줄 (프린세스 책 줄과 같은 짜임): 작은 사진 · 이름 · 회색 한 줄, 오른쪽에 날짜와 ＋. 펼치면 안쪽 내용이 바로 아래에 열린다 */
function wineRowHTML(wine, withYear) {
  const thumb = wine.photo_thumbnail_url || wine.photo_url
    ? '<img src="' + esc(wine.photo_thumbnail_url || wine.photo_url) + '" loading="lazy" decoding="async" alt="" />'
    : "";
  const meta = [typeLabels[wine.wine_type] || "", wine.vintage ? vintageLabel(wine.vintage) : "", wine.country].filter(Boolean).join(" · ");
  const ariaLabel = (wine.vintage ? vintageLabel(wine.vintage) + " " : "") + wine.name;
  const isOpen = wineOpenId === String(wine.id);
  return '<article class="wine-item' + (isOpen ? " open" : "") + '" id="wine-' + esc(wine.id) + '">'
    + '<button class="wine-row" data-action="toggle-wine" data-id="' + esc(wine.id) + '" aria-expanded="' + isOpen + '" aria-label="' + esc(ariaLabel) + '">'
    + '<span class="wine-thumb">' + thumb + "</span>"
    + '<span class="wine-row-copy"><strong class="wine-row-name">' + esc(wine.name) + "</strong>"
    + '<span class="wine-row-meta">' + esc(meta) + localBadgeHTML(wine) + "</span></span>"
    + '<span class="wine-row-side">' + (wine.consumed_date ? '<span class="wine-row-date">' + esc(shortDate(wine.consumed_date, withYear)) + "</span>" : "")
    + '<span class="fold-sign">' + (isOpen ? ICON_MINUS : ICON_PLUS) + "</span></span>"
    + "</button>"
    + (isOpen ? wineBodyHTML(wine) : "")
    + "</article>";
}
/* 날짜순일 때는 연도 줄이 따로 있으니 월.일만, 아니면 26.10.5처럼 연도를 붙인다 */
function shortDate(date, withYear) {
  const parts = String(date).split("-");
  if (!parts[0] || !parts[1] || !parts[2]) return date;
  return (withYear ? parts[0].slice(2) + "." : "") + Number(parts[1]) + "." + Number(parts[2]);
}

function localBadgeHTML(wine) {
  const state = localState(wine);
  if (state === "added") return '<span class="local-badge">이 기기에만 저장</span>';
  if (state === "edited") return '<span class="local-badge">이 기기에서 수정</span>';
  return "";
}
function typeFilterHTML() {

}
function wineListHTML(list) {

  }

  list.forEach(function (wine, index) {

    html += '<div class="wine-list-entry">'

  return html + "</div>";
}
/* 평점이 하나도 없으면 평점 순은 의미가 없으니 뺀다 */
function sortSelectHTML() {
  const options = [["recent", "최근 마신 순"]];

/* 기록 · 품종 · 산지 · 사전을 한꺼번에 찾아 카드별로 보여 준다. 줄은 그 자리에서 펼친다 */
function searchResultsHTML() {
  const query = searchText.trim();
  const wineNeedle = query.toLocaleLowerCase("ko-KR");

  let html = "";
  let found = 0;
  const wineHits = wines.filter(function (wine) { return wineMatches(wine, wineNeedle); }).sort(function (a, b) {
    return String(b.consumed_date || b.updated_at).localeCompare(String(a.consumed_date || a.updated_at));
  });
  if (wineHits.length > 0) {
    found += wineHits.length;
    html += '<div class="fold-card wine-card"><div class="note-group-label search-label">와인 기록 · ' + wineHits.length + "병</div>"
      + '<div class="wine-list">' + wineHits.map(function (wine) { return '<div class="wine-list-entry">' + wineRowHTML(wine, true) + "</div>"; }).join("") + "</div></div>";
  }
  noteTabs.forEach(function (tab) {
    const hits = (noteCollections[tab.key] || []).filter(function (note) { return noteMatches(note, noteNeedle); });
    if (hits.length === 0) return;
    found += hits.length;
    html += '<div class="fold-card notes-card"><div class="note-group-label search-label">' + esc(tab.label) + " · " + hits.length + tab.unit + "</div>"
      + hits.map(noteItemHTML).join("") + "</div>";
  });

    html += '<div class="fold-card"><div class="no-results"><p>일치하는 결과가 없습니다.</p><button class="text-button" data-action="clear-search">검색어 지우기</button></div></div>';
  }
  return html;
}
/* 검색어만 바뀔 때는 검색창 아래만 다시 그려 한글 입력이 끊기지 않게 한다 */

/* 접거나 펼친 뒤 그 줄이 위에 붙은 줄 뒤로 숨었으면 제목 자리로 돌아간다 */

/* photo upload: downscale so records fit in browser storage */
function drawScaled(img, maxDim, mime, quality) {
  const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * scale));
  const h = Math.max(1, Math.round(img.naturalHeight * scale));
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(img, 0, 0, w, h);
  return canvas.toDataURL(mime, quality);
}
function processImageFile(file) {
  return new Promise(function (resolve, reject) {
    if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) { reject(new Error("unsupported-image")); return; }
    if (file.size > 8000000) { reject(new Error("too-large")); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function () {
      URL.revokeObjectURL(url);
      resolve({ photo_url: drawScaled(img, 1000, "image/jpeg", 0.85), photo_thumbnail_url: drawScaled(img, 240, "image/jpeg", 0.8) });
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("bad-image")); };
    img.src = url;
  });
}

const appEl = document.getElementById("app");
function applyScroll() {
  const target = Math.max(1, pendingScroll);
  window.scrollTo(0, target);
  window.requestAnimationFrame(function () {
    const maxScrollY = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    window.scrollTo(0, Math.min(target, maxScrollY));
  });
}

function centerActivePills(scope) {
  scope.querySelectorAll(".notes-kinds, .type-filter").forEach(function (row) {
    const on = row.querySelector(".active");
    if (on) row.scrollLeft = on.offsetLeft - (row.clientWidth - on.offsetWidth) / 2;
  });
}
function render(options) {
  options = options || {};
  const active = document.activeElement;
  const focusId = active && active.id === "search" ? active.id : null;
  const caret = focusId ? active.selectionStart : null;
  const keepY = options.keepScroll ? window.scrollY : null;

  if (wineOpenId && !getWine(wineOpenId)) { wineOpenId = null; wineOpenSection = null; }
  let html = "";
  if (loadState !== "ready") html = stateHTML();
  else if (view === "form") html = formHTML();
  else html = activeTab === "records" ? collectionHTML() : notesHTML();
  appEl.innerHTML = html;
  centerActivePills(appEl);
  initPinchZooms(appEl);
  syncWineRowHeight();
  bindViewEvents();
  if (options.restoreScroll) applyScroll();
  else if (keepY !== null) window.scrollTo(0, keepY);
  if (focusId) {
    const input = document.getElementById(focusId);
    if (input) {
      input.focus();
      try { input.setSelectionRange(caret, caret); } catch (e) {}
    }
  }
}
function rememberCollectionScroll() { collectionScroll = Math.max(1, window.scrollY); }

/* ---- history: the phone's back gesture closes the open sheet ---- */
function pushLayer() {
  try { history.pushState({ wineLayer: historyDepth + 1 }, ""); historyDepth += 1; } catch (e) {}
}
/* close via history when a layer was pushed; popstate then does the actual close */
function popLayer(fallback) {
  if (historyDepth > 0) history.back();
  else fallback();
}
/* drop history entries silently after navigating in code */
function dropLayers(count) {
  const n = Math.min(count, historyDepth);
  if (n <= 0) return;
  historyDepth -= n;
  ignoreNextPop = true;
  history.go(-n);
}
function confirmDiscard() {
  if (!formDirty) return true;
  if (!window.confirm("저장하지 않은 내용이 사라집니다. 닫을까요?")) return false;
  formDirty = false;
  return true;
}
function requestClose() {
  if (view === "form") { if (confirmDiscard()) popLayer(closeForm); }
}
window.addEventListener("popstate", function () {
  if (ignoreNextPop) { ignoreNextPop = false; return; }
  historyDepth = Math.max(0, historyDepth - 1);
  if (view === "form") {
    if (!confirmDiscard()) { pushLayer(); return; }
    closeForm();
  }
});
document.addEventListener("keydown", function (event) {
  if (event.key !== "Escape" || event.isComposing) return;
  if (view === "form") { event.preventDefault(); requestClose(); }
});
