<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141719" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="Wine" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Wine</title>
    <style>


:root {--fs-xl:24px;--fs-l:18px;--fs-m:16px;--fs-s:14px;
  color-scheme: light dark;
  --bg: #f3f4f6;
  --surface: #ffffff;
  --surface-raised: #ffffff;
  --text: #202528;
  --dim: #646c72;
  --border: #d8dde0;
  --accent: #0d6b6b;
  --accent-strong: #0d6b6b;
  --accent-soft: #dcebea;
  --on-accent: #ffffff;
  --danger: #b42332;
  --wine-red: #782f3a;
  --wine-white: #c49a45;
  --wine-sparkling: #8b7b3f;
  --wine-rose: #b96672;
  --wine-orange: #b66732;
  --wine-dessert: #956f24;
  --wine-fortified: #684149;
  --photo-bg: #e7e3df;
  --radius: 10px;
  --space-surface: var(--surface);
  --space-surface-alt: var(--surface-raised);
  --space-muted: var(--dim);
  --space-border: var(--border);
  --space-accent: var(--accent);
  font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  font-size: var(--fs-m);
  line-height: 1.6;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141719;
    --surface: #1d2225;
    --surface-raised: #23292c;
    --text: #f2f4f5;
    --dim: #abb3b8;
    --border: #394146;
    --accent: #62bdbc;
    --accent-strong: #62bdbc;
    --accent-soft: #203f40;
    --on-accent: #0b2526;
    --danger: #ff9da8;
    --wine-red: #a14f5c;
    --wine-white: #d4ad5b;
    --wine-sparkling: #b8a359;
    --wine-rose: #d7818b;
    --wine-orange: #d98249;
    --wine-dessert: #bd9340;
    --wine-fortified: #98646d;
    --photo-bg: #292d2f;
  }
}

* { box-sizing: border-box; }
html {
  height: auto;
  min-height: 100%;
  background: var(--bg);
  overscroll-behavior-y: none;
}
body {
  height: auto;
  min-height: calc(100dvh + 1px);
  margin: 0;
  min-width: 320px;
  overflow-x: clip;
  background: var(--bg);
  color: var(--text);
  font-size: var(--fs-m);
  line-height: 1.6;
  word-break: keep-all;
  overscroll-behavior-y: none;
}
[data-generated-space-root] {
  position: static;
  inset: auto;
  height: auto;
  min-height: 100dvh;
  overflow: visible;
  overscroll-behavior-y: none;
}
.hatch-space-root[data-hatch-space-root] {
  height: auto;
  min-height: 100dvh;
  overflow: visible;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--accent) 30%, transparent);
  outline-offset: 2px;
}
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

.app-shell {
  position: relative;
  min-height: 100dvh;
  overflow: visible;
  overflow-anchor: none;
  background: var(--bg);
  overscroll-behavior-y: none;
}
.page-wrap {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 36px);
}
.hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 0 22px;
  border-bottom: 1px solid var(--border);
}
.hero-count { margin: 0 0 2px; color: var(--dim); font-size: var(--fs-s); line-height: 25px; }
.hero-count span { color: var(--accent); font-size: var(--fs-m); font-weight: 750; margin-right: 2px; }
.hero h1 { margin: 0; font-size: var(--fs-xl); line-height: 37px; letter-spacing: -0.02em; font-weight: 760; }
.primary-button {
  min-height: 46px;
  border: 0;
  border-radius: var(--radius);
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 700;
  padding: 0 18px;
  cursor: pointer;
}
.primary-button:active { opacity: .86; }
.primary-button:disabled { opacity: .52; cursor: default; }
.primary-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.hero-button { display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; }

.state-panel, .empty-state {
  min-height: 52vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 44px 16px;
}
.state-panel h2, .empty-state h2 { margin: 16px 0 6px; font-size: var(--fs-xl); line-height: 37px; letter-spacing: -.02em; }
.state-panel p, .empty-state p { max-width: 340px; margin: 0 0 22px; color: var(--dim); font-size: var(--fs-m); line-height: 26px; }
.loader { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 10px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .loader { animation: none; border-color: var(--accent); } }
.empty-bottle { position: relative; width: 74px; height: 110px; margin-bottom: 8px; filter: drop-shadow(0 8px 8px color-mix(in srgb, #000 14%, transparent)); }
.bottle-neck { position: absolute; left: 29px; top: 0; width: 16px; height: 31px; background: var(--wine-red); border-radius: 3px 3px 0 0; }
.bottle-neck::after { content: ""; position: absolute; left: -2px; top: 5px; width: 20px; height: 5px; background: #3e292d; border-radius: 2px; }
.bottle-body { position: absolute; left: 15px; bottom: 0; width: 44px; height: 83px; background: var(--wine-red); border-radius: 14px 14px 6px 6px; }
.bottle-body::before { content: ""; position: absolute; inset: 8px auto 8px 8px; width: 5px; border-radius: 3px; background: color-mix(in srgb, #fff 16%, transparent); }
.bottle-body::after { content: ""; position: absolute; left: 7px; top: 27px; width: 30px; height: 27px; background: #f2ece1; border-top: 4px solid #c9b995; border-radius: 2px; }
.text-button { border: 0; background: transparent; color: var(--accent); font-weight: 700; cursor: pointer; padding: 8px 4px; }

.summary-strip { display: grid; grid-template-columns: repeat(3, 1fr); padding: 18px 0; border-bottom: 1px solid var(--border); }
.summary-strip div { display: flex; flex-direction: column; gap: 1px; padding: 0 14px; border-right: 1px solid var(--border); }
.summary-strip div:first-child { padding-left: 0; }
.summary-strip div:last-child { border-right: 0; }
.summary-strip strong { color: var(--accent); font-size: var(--fs-xl); line-height: 34px; font-weight: 760; }
.summary-strip span { color: var(--dim); font-size: var(--fs-s); line-height: 25px; }
.collection { padding-top: 24px; }
.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
.section-heading h2 { margin: 0; font-size: var(--fs-m); line-height: 27px; letter-spacing: -.01em; font-weight: 750; }
.sort-control select {
  appearance: none;
  border: 0;
  background-color: transparent;
  color: var(--dim);
  padding: 7px 19px 7px 4px;
  font-size: var(--fs-m);
  line-height: 25px;
  font-weight: 650;
  background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%);
  background-position: calc(100% - 8px) 50%, calc(100% - 4px) 50%;
  background-size: 4px 4px, 4px 4px;
  background-repeat: no-repeat;
}
.status-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; margin-bottom: 10px; border-radius: var(--radius); background: color-mix(in srgb, var(--border) 58%, transparent); }
.status-tabs button { min-height: 38px; border: 0; border-radius: 7px; background: transparent; color: var(--dim); font-size: var(--fs-s); font-weight: 700; cursor: pointer; }
.status-tabs button.active { background: var(--surface); color: var(--accent); box-shadow: 0 1px 2px color-mix(in srgb, var(--text) 10%, transparent); }
.search-box { height: 46px; display: flex; align-items: center; gap: 9px; padding: 0 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; }
.search-box > svg { width: 18px; height: 18px; fill: none; stroke: var(--dim); stroke-width: 1.8; }
.search-box input { min-width: 0; flex: 1; border: 0; background: transparent; color: var(--text); outline: 0; font-size: var(--fs-m); }
.search-box input::placeholder { color: var(--dim); }
.search-box button { border: 0; background: transparent; padding: 4px; color: var(--dim); }
.search-box button svg, .icon-button svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.wine-list { border-top: 1px solid var(--border); }
.wine-row {
  width: 100%;
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr) 18px;
  gap: 12px;
  align-items: center;
  text-align: left;
  border: 0;
  border-bottom: 1px solid var(--border);
  background: transparent;
  padding: 15px 0;
  cursor: pointer;
}
.wine-row:active { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.wine-thumb {
  width: 64px;
  height: 80px;
  border-radius: 9px;
  overflow: hidden;
  display: grid;
  place-items: center;
  background: var(--photo-bg);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text) 7%, transparent);
}
.wine-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 62%;
}
.wine-mark {
  display: inline-grid;
  place-items: center;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--wine-red);
  flex: 0 0 auto;
}
.wine-thumb .wine-mark {
  width: 29px;
  height: 49px;
  border-radius: 9px 9px 6px 6px;
  position: relative;
  margin-top: 7px;
  box-shadow: 0 5px 10px color-mix(in srgb, #000 22%, transparent);
}
.wine-thumb .wine-mark::before {
  content: "";
  position: absolute;
  width: 11px;
  height: 14px;
  left: 9px;
  top: -11px;
  background: inherit;
  border-radius: 2px 2px 0 0;
}
.wine-thumb .wine-mark::after {
  content: "";
  position: absolute;
  width: 15px;
  height: 3px;
  left: 7px;
  top: -8px;
  background: color-mix(in srgb, var(--text) 30%, #161616);
  border-radius: 1px;
}
.wine-mark-label {
  display: none;
}
.wine-thumb .wine-mark-label {
  display: block;
  width: 20px;
  height: 18px;
  border-radius: 2px;
  background: #f2ece1;
  border-top: 3px solid color-mix(in srgb, currentColor 40%, #c9b995);
  opacity: .96;
}
.wine-mark--red { background: var(--wine-red); }
.wine-mark--white { background: var(--wine-white); }
.wine-mark--sparkling { background: var(--wine-sparkling); }
.wine-mark--rose { background: var(--wine-rose); }
.wine-mark--orange { background: var(--wine-orange); }
.wine-mark--dessert { background: var(--wine-dessert); }
.wine-mark--fortified { background: var(--wine-fortified); }
.wine-row-copy { min-width: 0; }
.wine-row-top { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: var(--fs-s); line-height: 22px; margin-bottom: 4px; }
.record-status { display: inline-flex; align-items: center; min-height: 20px; padding: 1px 6px; border-radius: 4px; font-size: var(--fs-s); line-height: 21px; font-weight: 750; color: var(--accent); background: var(--accent-soft); }
.record-status.researched { color: var(--accent); background: var(--accent-soft); }
.wine-kind { color: var(--dim); font-weight: 650; }
.wine-date::before { content: "·"; margin-right: 7px; }
.wine-row h3 { margin: 0; color: var(--accent); font-size: var(--fs-m); line-height: 27px; letter-spacing: -.01em; font-weight: 750; overflow-wrap: anywhere; }
.wine-row p { margin: 3px 0 0; color: var(--dim); font-size: var(--fs-s); line-height: 25px; overflow-wrap: anywhere; }
.rating { display: inline-flex; align-items: center; gap: 4px; margin-top: 5px; color: var(--text); font-size: var(--fs-m); line-height: 26px; font-weight: 700; }
.rating::before { content: "★"; color: var(--accent); }
.wine-row .research-glance { margin-top: 5px; color: var(--text); font-size: var(--fs-s); font-weight: 650; }
.row-arrow svg { width: 18px; height: 18px; fill: none; stroke: var(--dim); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.no-results { text-align: center; color: var(--dim); padding: 42px 12px; font-size: var(--fs-m); }
.no-results p { margin: 0 0 4px; }

.sheet {
  position: relative;
  z-index: 20;
  min-height: 100%;
  overflow: visible;
  background: var(--bg);
  color: var(--text);
}
.sheet-bar {
  position: sticky;
  top: 0;
  z-index: 5;
  min-height: calc(env(safe-area-inset-top) + 58px);
  padding: calc(env(safe-area-inset-top) + 8px) max(18px, calc((100% - 560px) / 2 + 18px)) 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.icon-button { width: 42px; height: 42px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 50%; cursor: pointer; }
.detail-page, .form-body { width: 100%; max-width: 560px; margin: 0 auto; padding: 22px 18px calc(env(safe-area-inset-bottom) + 38px); }
.detail-photo-frame {
  width: min(100%, 400px);
  aspect-ratio: 4 / 5;
  display: grid;
  place-items: center;
  margin: 0 auto 24px;
  padding: 12px;
  overflow: hidden;
  border-radius: 12px;
  background: var(--photo-bg);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text) 8%, transparent), 0 8px 24px color-mix(in srgb, #000 11%, transparent);
}
.detail-photo {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 6px;
}
.detail-lead { padding: 4px 0 22px; border-bottom: 1px solid var(--border); }
.detail-meta { display: flex; align-items: center; gap: 7px; color: var(--dim); font-size: var(--fs-s); line-height: 25px; margin-bottom: 8px; }
.detail-meta .wine-mark { width: 9px; height: 9px; }
.detail-lead h2 { margin: 0; color: var(--accent); font-size: var(--fs-xl); line-height: 37px; letter-spacing: -.02em; overflow-wrap: anywhere; }
.detail-section { padding: 22px 0; border-bottom: 1px solid var(--border); }
.detail-section h3 { margin: 0 0 14px; font-size: var(--fs-m); line-height: 27px; font-weight: 750; letter-spacing: -.01em; }
.detail-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.detail-heading h3 { margin: 0; }
.detail-heading > span { color: var(--dim); font-size: var(--fs-s); line-height: 25px; }
.detail-bullets { display: grid; gap: 11px; margin: 0; padding: 0 0 0 18px; }
.detail-bullets li { padding-left: 2px; color: var(--accent); }
.detail-bullets li::marker { font-size: var(--fs-s); }
.detail-bullets li > strong { display: block; margin-bottom: 1px; color: var(--dim); font-size: var(--fs-s); line-height: 25px; }
.detail-bullets li > span { display: block; color: var(--text); font-size: var(--fs-m); line-height: 30px; white-space: pre-wrap; overflow-wrap: anywhere; }
.verdict-judgment { margin: 0; color: var(--text); font-size: var(--fs-m); font-weight: 750; line-height: 30px; }
.verdict-evidence { margin-top: 16px; }
.verdict-evidence h4 { margin: 0 0 8px; color: var(--dim); font-size: var(--fs-s); line-height: 25px; }
.verdict-list li > span { font-weight: 500; }
.detail-bullets > .taste-item { color: transparent; }
.detail-bullets > .taste-item > strong { color: var(--dim); }
.detail-bullets > .taste-item > ul { display: grid; gap: 6px; margin: 4px 0 0; padding-left: 17px; }
.detail-bullets > .taste-item > ul li { color: var(--text); padding-left: 2px; font-size: var(--fs-m); line-height: 30px; }
.detail-bullets .rating { margin-top: 0; font-size: var(--fs-m); }
.detail-empty { color: var(--dim); padding: 24px 0; font-size: var(--fs-m); line-height: 26px; }
.danger-zone { padding: 30px 0 8px; text-align: center; }
.delete-link { border: 0; background: transparent; color: var(--danger); padding: 10px; cursor: pointer; font-size: var(--fs-m); }
.delete-confirm { padding: 16px; border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--border)); background: var(--surface); border-radius: var(--radius); }
.delete-confirm p { margin: 0 0 12px; font-weight: 700; }
.delete-confirm div { display: flex; gap: 8px; }
.delete-confirm button { flex: 1; min-height: 44px; border: 1px solid var(--border); background: transparent; border-radius: 8px; cursor: pointer; }
.delete-confirm button:last-child { border-color: var(--danger); background: var(--danger); color: #fff; }
.delete-confirm span { display: block; margin-top: 8px; color: var(--danger); font-size: var(--fs-s); }

.form-sheet form { min-height: 100%; }
.form-bar { display: grid; grid-template-columns: 44px 1fr 58px; }
.form-bar h2 { margin: 0; text-align: center; font-size: var(--fs-xl); line-height: 37px; letter-spacing: -.02em; }
.save-button { border: 0; background: transparent; color: var(--accent); font-weight: 750; padding: 8px 0; cursor: pointer; }
.save-button:disabled { opacity: .52; }
.form-body { padding-top: 4px; }
.form-section { padding: 22px 0; border-bottom: 1px solid var(--border); }
.form-section:last-of-type { border-bottom: 0; }
.form-section h3 { margin: 0 0 14px; font-size: var(--fs-m); line-height: 27px; font-weight: 750; }
.status-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.status-choice button { min-height: 76px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); text-align: left; cursor: pointer; }
.status-choice button strong { font-size: var(--fs-m); line-height: 27px; }
.status-choice button span { color: var(--dim); font-size: var(--fs-s); line-height: 23px; }
.status-choice button.active { border-color: var(--accent); background: var(--accent-soft); }
.status-choice button.active strong, .status-choice button.active.researched strong { color: var(--accent); }
.research-form-section, .research-section { border-top: 0; }
.photo-section { display: flex; flex-direction: column; align-items: center; }
.photo-picker { width: min(100%, 240px); aspect-ratio: 4 / 5; border: 1px dashed var(--border); border-radius: 12px; background: var(--photo-bg); position: relative; overflow: hidden; display: grid; place-items: center; color: var(--dim); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text) 4%, transparent); }
.photo-picker.has-photo { border-style: solid; }
.photo-picker > div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: var(--fs-s); font-weight: 650; }
.photo-picker > div svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.photo-picker img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }
.photo-picker label { position: absolute; inset: 0; cursor: pointer; }
.photo-picker label input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.photo-picker label span { position: absolute; bottom: 8px; left: 8px; right: 8px; min-height: 34px; display: grid; place-items: center; color: #fff; background: color-mix(in srgb, #000 72%, transparent); border-radius: 7px; font-size: var(--fs-s); font-weight: 700; }
.remove-photo { border: 0; background: transparent; color: var(--danger); margin-top: 8px; padding: 7px; font-size: var(--fs-s); cursor: pointer; }
.field { display: block; margin-top: 16px; }
.field:first-of-type { margin-top: 0; }
.field > span { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; color: var(--dim); font-size: var(--fs-s); line-height: 25px; font-weight: 700; }
.field > span b { color: var(--accent); font-size: var(--fs-s); font-weight: 700; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-raised); color: var(--text); padding: 10px 11px; font-size: var(--fs-m); line-height: 30px; outline: 0; }
.field input, .field select { min-height: 46px; }
.field textarea { resize: vertical; }
.field input::placeholder, .field textarea::placeholder { color: color-mix(in srgb, var(--dim) 78%, transparent); }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.input-suffix { position: relative; }
.input-suffix input { padding-right: 34px; }
.input-suffix span { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); color: var(--dim); font-size: var(--fs-m); }
.form-error { color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, var(--surface)); border-radius: 8px; padding: 11px; margin: 14px 0 0; font-size: var(--fs-m); line-height: 26px; }
.form-submit { width: 100%; margin-top: 18px; }

@media (max-width: 420px) {
  .page-wrap, .detail-page, .form-body { padding-left: 15px; padding-right: 15px; }
  .sheet-bar { padding-left: 15px; padding-right: 15px; }
  .summary-strip div { padding: 0 10px; }

      pinchStart = { distance: Math.max(1, distance(pts[0], pts[1])), center: { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 }, transform: { scale: transform.scale, x: transform.x, y: transform.y } };
    }
  }
  frame.addEventListener("pointerup", pointerEnd);
  frame.addEventListener("pointercancel", pointerEnd);
  frame.addEventListener("wheel", function (event) {
    if (!event.ctrlKey && !event.metaKey) return;
    event.preventDefault();
    requestHighResolution();
    applyTransform({ scale: transform.scale * Math.exp(-event.deltaY * 0.01), x: transform.x, y: transform.y });
  }, { passive: false });
  frame.addEventListener("dblclick", reset);
  void previewSrc;
}
function initPinchZooms(scope) {

function filteredWines() {
  const needle = searchText.trim().toLocaleLowerCase("ko-KR");
  const matched = wines.filter(function (wine) {
    if (typeFilter !== "all" && wine.wine_type !== typeFilter) return false;
    if (!needle) return true;
    return [wine.name, wine.producer, wine.vintage, wine.country, wine.region, wine.grapes, wine.personal_notes, wine.info_notes, wine.buy_verdict]
      .join(" ").toLocaleLowerCase("ko-KR").includes(needle);
  });
  matched.sort(function (a, b) {
    if (sortMode === "rating") return (b.rating || 0) - (a.rating || 0) || String(b.updated_at).localeCompare(String(a.updated_at));
    if (sortMode === "name") return a.name.localeCompare(b.name, "ko-KR");
    const aDate = a.consumed_date || a.updated_at;
    const bDate = b.consumed_date || b.updated_at;
    return String(bDate).localeCompare(String(aDate)) || String(b.created_at).localeCompare(String(a.created_at));
  });
  return matched;
}

/* photo upload: downscale so records fit in browser storage */
function drawScaled(img, maxDim, mime, quality) {
  const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * scale));
  const h = Math.max(1, Math.round(img.naturalHeight * scale));
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(img, 0, 0, w, h);
  return canvas.toDataURL(mime, quality);
}
function processImageFile(file) {
  return new Promise(function (resolve, reject) {
    if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) { reject(new Error("unsupported-image")); return; }
    if (file.size > 8000000) { reject(new Error("too-large")); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function () {
      URL.revokeObjectURL(url);
      resolve({ photo_url: drawScaled(img, 1000, "image/jpeg", 0.85), photo_thumbnail_url: drawScaled(img, 240, "image/jpeg", 0.8) });
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("bad-image")); };
    img.src = url;
  });
}

const appEl = document.getElementById("app");
function applyScroll() {
  const target = Math.max(1, pendingScroll);
  window.scrollTo(0, target);
  window.requestAnimationFrame(function () {
    const maxScrollY = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    window.scrollTo(0, Math.min(target, maxScrollY));
  });
}
function stateHTML() {

function render(options) {
  options = options || {};
  const active = document.activeElement;
  const focusId = active && (active.id === "wine-search" || active.id === "notes-search") ? active.id : null;
  const caret = focusId ? active.selectionStart : null;
  const keepY = options.keepScroll ? window.scrollY : null;

  if (view === "detail" && !getWine(selectedId)) { view = "collection"; selectedId = null; }
  let html = "";
  if (loadState !== "ready") html = stateHTML();
  else if (view === "detail") html = detailHTML(getWine(selectedId));
  else if (view === "form") html = formHTML();
  else html = activeTab === "records" ? collectionHTML() : notesHTML();
  appEl.innerHTML = html;
  initPinchZooms(appEl);
  bindViewEvents();
  if (options.restoreScroll) applyScroll();
  else if (keepY !== null) window.scrollTo(0, keepY);
  if (focusId) {
    const input = document.getElementById(focusId);
    if (input) {
      input.focus();
      try { input.setSelectionRange(caret, caret); } catch (e) {}
    }
  }
}
function rememberCollectionScroll() { collectionScroll = Math.max(1, window.scrollY); }

/* ---- history: the phone's back gesture closes the open sheet ---- */
function pushLayer() {
  try { history.pushState({ wineLayer: historyDepth + 1 }, ""); historyDepth += 1; } catch (e) {}
}
/* close via history when a layer was pushed; popstate then does the actual close */
function popLayer(fallback) {
  if (historyDepth > 0) history.back();
  else fallback();
}
/* drop history entries silently after navigating in code */
function dropLayers(count) {
  const n = Math.min(count, historyDepth);
  if (n <= 0) return;
  historyDepth -= n;
  ignoreNextPop = true;
  history.go(-n);
}
function confirmDiscard() {
  if (!formDirty) return true;
  if (!window.confirm("저장하지 않은 내용이 사라집니다. 닫을까요?")) return false;
  formDirty = false;
  return true;
}
function requestClose() {
  if (view === "form") { if (confirmDiscard()) popLayer(closeForm); }
  else if (view === "detail") popLayer(closeDetail);
}
window.addEventListener("popstate", function () {
  if (ignoreNextPop) { ignoreNextPop = false; return; }
  historyDepth = Math.max(0, historyDepth - 1);
  if (view === "form") {
    if (!confirmDiscard()) { pushLayer(); return; }
    closeForm();
  } else if (view === "detail") {
    closeDetail();
  }
});
document.addEventListener("keydown", function (event) {
  if (event.key !== "Escape" || event.isComposing) return;
  if (view === "form" || view === "detail") { event.preventDefault(); requestClose(); }
});

function saveForm() {
  formError = "";
  if (!form.name.trim()) { formError = "와인 이름을 입력해 주세요"; render({ keepScroll: true }); return; }
  if (!form.consumedDate) { formError = "마신 날을 입력해 주세요"; render({ keepScroll: true }); return; }
  const payload = payloadFromForm(form);
  const now = new Date().toISOString();
  let saved = false;
  if (formMode === "edit") {
    const wine = getWine(selectedId);
    if (!wine) return;
    const updated = Object.assign({}, wine, payload, { updated_at: now });
    if (formPhoto === "removed") { updated.photo_url = null; updated.photo_thumbnail_url = null; }
    else if (formPhoto) { updated.photo_url = formPhoto.photo_url; updated.photo_thumbnail_url = formPhoto.photo_thumbnail_url; }
    saved = commitLocal(function (l) {
      if (isLocalId(wine.id)) l.added = l.added.map(function (w) { return String(w.id) === String(wine.id) ? updated : w; });
      else l.edited[String(wine.id)] = updated;
    });
  } else {
    const created = Object.assign({}, payload, {
      id: "local-" + Date.now(), basis_note: "", created_at: now, updated_at: now,
      photo_url: formPhoto ? formPhoto.photo_url : null,
      photo_thumbnail_url: formPhoto ? formPhoto.photo_thumbnail_url : null
    });
    saved = commitLocal(function (l) { l.added = [created].concat(l.added); });
  }
  if (!saved) {
    formError = "저장 공간이 부족해 저장하지 못했습니다. 사진을 빼고 다시 시도해 주세요.";
    render({ keepScroll: true });
    return;
  }
  formDirty = false;
  dropLayers(1);
  if (formMode === "edit") {
    pendingScroll = detailScroll;
    formMode = null;
    view = "detail";
  } else {
    pendingScroll = collectionScroll;
    formMode = null;
    selectedId = null;
    view = "collection";
    activeTab = "records";
  }
  render({ restoreScroll: true });
}
function deleteSelected() {
  const id = String(selectedId);
  commitLocal(function (l) {
    if (isLocalId(id)) {
      l.added = l.added.filter(function (w) { return String(w.id) !== id; });
    } else {
      delete l.edited[id];
      if (l.deleted.indexOf(id) === -1) l.deleted.push(id);
    }
  });
  dropLayers(1);
  closeDetail();
}
function revertSelected() {
  const id = String(selectedId);
  commitLocal(function (l) { delete l.edited[id]; });
  render({ keepScroll: true });
}

/* ================= events ================= */
function bindViewEvents() {
  const wineSearch = document.getElementById("wine-search");
  if (wineSearch) {
    wineSearch.addEventListener("input", function () {
      searchText = wineSearch.value;
      refreshWineResults();
    });
  }
  const sortSelect = document.getElementById("sort-select");
  if (sortSelect) {
    sortSelect.addEventListener("change", function () {
      sortMode = sortSelect.value;
      refreshWineResults();
    });
  }
  const notesSearch = document.getElementById("notes-search");
  if (notesSearch) {
    notesSearch.addEventListener("input", function () {
      notesQuery = notesSearch.value;
      refreshNotesResults();
    });
  }
  const formEl = document.getElementById("wine-form");
  if (formEl) {
    formEl.querySelectorAll("[data-field]").forEach(function (input) {
      const update = function () { form[input.getAttribute("data-field")] = input.value; formDirty = true; };
      input.addEventListener("input", update);
      input.addEventListener("change", update);
    });
    formEl.querySelectorAll("[data-score-key]").forEach(function (input) {
      input.addEventListener("input", function () {
        const index = Number(input.getAttribute("data-score-index"));
        form.scores[index][input.getAttribute("data-score-key")] = input.value;
        formDirty = true;
      });
    });
    const photoInput = document.getElementById("photo-input");
    if (photoInput) {
      photoInput.addEventListener("change", function () {
        const file = photoInput.files && photoInput.files[0];
        if (!file) return;
        processImageFile(file).then(function (result) {
          formPhoto = result;
          formError = "";
          formDirty = true;
          render({ keepScroll: true });
        }).catch(function (error) {
          formError = error && error.message === "too-large" ? "8MB 미만 사진만 선택 가능" : error && error.message === "unsupported-image" ? "JPG, PNG, WEBP 사진만 선택 가능" : "사진을 불러오지 못했습니다";
          render({ keepScroll: true });
        });
      });
    }
    formEl.addEventListener("submit", function (event) {
      event.preventDefault();
      saveForm();
    });
  }
}

appEl.addEventListener("click", function (event) {
  const target = event.target.closest("[data-action]");
  if (!target) return;
  const action = target.getAttribute("data-action");
  if (action === "add-wine") openAdd();
  else if (action === "retry-load") loadData();
  else if (action === "open-detail") openDetail(target.getAttribute("data-id"));
  else if (action === "close-detail" || action === "close-form") requestClose();
  else if (action === "edit-wine") openEdit();
  else if (action === "ask-delete") { detailConfirmDelete = true; render({ keepScroll: true }); }
  else if (action === "cancel-delete") { detailConfirmDelete = false; render({ keepScroll: true }); }
  else if (action === "confirm-delete") deleteSelected();
  else if (action === "revert-wine") revertSelected();
  else if (action === "tab") {
    const tab = target.getAttribute("data-tab");
    if (tab !== activeTab) { activeTab = tab; render({ keepScroll: true }); }
  }
  else if (action === "type-filter") { typeFilter = target.getAttribute("data-type"); render({ keepScroll: true }); }
  else if (action === "clear-search") { searchText = ""; render({ keepScroll: true }); }
  else if (action === "reset-filters") { searchText = ""; typeFilter = "all"; render({ keepScroll: true }); }
  else if (action === "clear-notes-search") { notesQuery = ""; render({ keepScroll: true }); }
  else if (action === "note-kind") {
    notesKind = target.getAttribute("data-kind");
    notesQuery = "";
    notesOpenId = null;
    render();
    window.scrollTo({ top: 1, behavior: "smooth" });
  }
  else if (action === "toggle-note") {
    const id = target.getAttribute("data-id");
    notesOpenId = notesOpenId === id ? null : id;
    render({ keepScroll: true });
  }
  else if (action === "open-note") openWineNote(target.getAttribute("data-note-id"));
  else if (action === "open-linked-wine") openDetail(target.getAttribute("data-id"));
  else if (action === "add-score") {
    form.scores.push({ source: "", vintage: "", score: "", ratingCount: "", note: "" });
    formDirty = true;
    render({ keepScroll: true });
  }
  else if (action === "remove-score") {
    form.scores.splice(Number(target.getAttribute("data-index")), 1);
    formDirty = true;
    render({ keepScroll: true });
  }
  else if (action === "remove-photo") {
    formPhoto = "removed";
    formDirty = true;
    render({ keepScroll: true });
  }
});

/* pull-to-refresh guard: keep the window off the top boundary */
window.addEventListener("scroll", function () {
  if (window.scrollY < 1) window.scrollTo(0, 1);
}, { passive: true });

loadData();
window.requestAnimationFrame(function () {
  if (window.scrollY < 1) window.scrollTo(0, 1);
});

    </script>
  </body>
